# Deploys the static site to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs cancel older queued ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Nothing is published unless the site checks pass (see check.yml).
  check:
    uses: ./.github/workflows/check.yml

  # The upload has its own job so that re-running a failed deploy reuses it.
  # Re-running a job that both uploads and deploys adds a second "github-pages"
  # artifact to the run, and the deploy then refuses to choose between them.
  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: true auto-enables GitHub Pages (build type: GitHub Actions)
        # on first run, so no manual Settings → Pages step is required.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # GitHub's side of a Pages deploy fails now and then and works a minute
      # later: "Deployment failed, try again later", or the artifact not found
      # yet. So a failed deploy waits and tries once more before the run fails.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before trying again
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy (second try)
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
