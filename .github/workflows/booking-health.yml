# Checks every hour that the live booking backend (the Google Apps Script web
# app in contact.html's data-api) answers, can read both calendars and send
# mail, and runs the same code as booking-api/google-apps-script.gs.
# Neither the site nor a broken backend can raise that alarm themselves, so
# this runs on GitHub, and a failed run is GitHub's email to you: one an hour
# for as long as the outage lasts.
#
# Run it now: Actions → Check booking backend → Run workflow.
# Run it locally: python3 .github/scripts/check_booking.py
#
# GitHub pauses scheduled workflows in a public repository after 60 days
# without commits, and emails a warning first. The site stays up either way;
# re-enable this from the Actions tab.
name: Check booking backend

on:
  schedule:
    # Every hour at :17, off the hour, when GitHub's scheduled runs are most
    # often delayed. An outage then shows within about an hour, not a day.
    - cron: "17 * * * *"
  workflow_dispatch:
  # Test changes to the check itself against the live backend.
  pull_request:
    paths:
      - .github/workflows/booking-health.yml
      - .github/scripts/check_booking.py

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check booking backend
        # A pull request's backend is not deployed until it merges, so there
        # the version is not compared.
        run: python3 .github/scripts/check_booking.py ${{ github.event_name == 'pull_request' && '--any-version' || '' }}
