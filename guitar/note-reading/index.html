  main.innerHTML = '<article class="view lesson">' +
    '<a class="back" href="#play">' + ICONS.back + 'All levels</a>' +
    '<header class="lesson-head"><p class="eyebrow">Lesson ' + (i + 1) + ' of ' + LESSONS.length + ' · ' + PARTS[L.part].split(' · ')[1] + '</p><h1 class="title">' + L.title + '</h1><p class="lede">' + L.summary + '</p></header>' +
    '<div class="lesson-body">' + L.body.map(b => typeof b === 'string' ? b : '<figure class="fig" data-fig="' + b.fig + '"></figure>').join('') + '</div>' +
    '<aside class="keypoints"><h2>Remember</h2><ul>' + L.keys.map(k => '<li>' + k + '</li>').join('') + '</ul></aside>' +
    '<div class="lesson-actions"><button class="btn primary" data-act="quiz">Take the level ' + (i + 1) + ' quiz' + ICONS.next + '</button>' + (Store.levelStars(id) ? starsHTML(Store.levelStars(id)) : '') + '</div>' +
    '<nav class="lesson-nav" aria-label="Other lessons">' + (prev ? '<a href="#lesson-' + prev.id + '" class="ln prev"><span>' + ICONS.back + 'Previous</span><b>' + prev.title + '</b></a>' : '<span></span>') +
    (next ? '<a href="#lesson-' + next.id + '" class="ln next"><span>Next' + ICONS.next + '</span><b>' + next.title + '</b></a>' : '<a href="#play" class="ln next"><span>Finished' + ICONS.next + '</span><b>Back to the levels</b></a>') + '</nav>' +
    '</article>';
  const root = main.firstElementChild;
  const cleanups = [];
  $$('.fig', root).forEach(f => { const fn = FIGS[f.dataset.fig]; if (fn) { try { const c = fn(f); if (typeof c === 'function') cleanups.push(c); } catch (err) { console.error(err); } } });
  App.cleanup = () => cleanups.forEach(c => c());
  root.addEventListener('click', e => { if (e.target.closest('[data-act="quiz"]')) startLevel(id); });
}

/* ---------- Practice ---------- */
function modeArt(mode) {
  const st = '<path d="M1 3h22M1 6h22M1 9h22M1 12h22M1 15h22" stroke="currentColor" stroke-width=".8" opacity=".55"/>';
  if (mode === 'read') return '<svg viewBox="0 0 24 18" aria-hidden="true">' + st + '<ellipse cx="11" cy="10.5" rx="2.6" ry="1.9" transform="rotate(-22 11 10.5)" fill="currentColor"/><text x="18.5" y="8" font-size="7" font-weight="700" fill="currentColor">?</text></svg>';
  if (mode === 'find') return '<svg viewBox="0 0 24 18" aria-hidden="true"><path d="M1 4h22M1 9h22M1 14h22" stroke="currentColor" stroke-width="1" opacity=".55"/><path d="M8 1v16M16 1v16" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9" r="3.2" fill="currentColor"/></svg>';
  if (mode === 'fret') return '<svg viewBox="0 0 24 18" aria-hidden="true"><path d="M1 4h22M1 9h22M1 14h22" stroke="currentColor" stroke-width="1" opacity=".55"/><path d="M8 1v16M16 1v16" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9" r="4.4" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="12" y="11.4" font-size="6.6" font-weight="700" text-anchor="middle" fill="currentColor">?</text></svg>';
  if (mode === 'rhythm') return '<svg viewBox="0 0 24 18" aria-hidden="true"><ellipse cx="7" cy="14" rx="2.6" ry="1.9" transform="rotate(-22 7 14)" fill="currentColor"/><path d="M9.3 13.4V2.5" stroke="currentColor" stroke-width="1.2"/><ellipse cx="16" cy="14" rx="2.6" ry="1.9" transform="rotate(-22 16 14)" fill="currentColor"/><path d="M18.3 13.4V2.5" stroke="currentColor" stroke-width="1.2"/><path d="M9.3 2.5h9" stroke="currentColor" stroke-width="2.2"/></svg>';
  return '<svg viewBox="0 0 24 18" aria-hidden="true">' + st + '<path d="' + GLYPHS.accidentalSharp.d + '" transform="translate(8 6) scale(3)" fill="currentColor"/><path d="' + GLYPHS.accidentalSharp.d + '" transform="translate(13.5 10.5) scale(3)" fill="currentColor"/></svg>';
}
function notesSummary(cfg) {
  const pool = notePool(cfg);
  if (!pool.length) return 'Choose at least one string.';
  const lo = pool[0], hi = pool[pool.length - 1];
  const lp = positionsOf(midiOf(lo), cfg.maxFret, cfg.strings), hp = positionsOf(midiOf(hi), cfg.maxFret, cfg.strings);
  const a = lp[lp.length - 1], b = hp[0];
  return '<b>' + pool.length + ' notes</b>, from ' + nmShort(lo) + ' (' + posLabel(a.s, a.f) + ') to ' + nmShort(hi) + ' (' + posLabel(b.s, b.f) + ').';
}
function lastRoundText(mode) {
  const r = Store.data.rounds[mode], best = Store.best(mode);
  const parts = [];
  if (r) {
    const days = Math.round((new Date(Store.todayStr()) - new Date(Store.todayStr(new Date(r.at)))) / 86400000);
    parts.push('Last round: ' + r.score + ' of ' + r.total + ', ' + (days <= 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago'));
  }
  if (best) parts.push('Best in 60 seconds: ' + best);
  return parts.length ? parts.join(' · ') : 'Not played yet';
}
function viewPractice(main) {
  const P = Store.data.practice;
  const cfg = P.notes;
  const modeRow = (mode, opts) => '<div class="mode"><div class="mode-art">' + modeArt(mode) + '</div><div class="mode-txt"><h3>' + MODES[mode].title + '</h3><p>' + MODES[mode].desc + '</p>' + (opts || '') + '<p class="mode-last">' + lastRoundText(mode) + '</p></div>' +
    '<div class="mode-btns"><button class="btn primary" data-start="' + mode + '">20 questions' + ICONS.next + '</button><button class="btn" data-challenge="' + mode + '">' + ICONS.clock + '60 seconds</button></div></div>';
  main.innerHTML = '<section class="view practice">' +
    '<header class="view-head"><h1 class="title">Practice</h1><p class="lede">Rounds of 20 questions, or a 60-second race against the clock. Notes you miss come back more often until you know them.</p></header>' +
    '<section class="pr-block"><h2 class="sec-title">Notes</h2>' +
      '<div class="pr-config">' +
        '<div class="field"><span class="field-label" id="lblStrings">Strings</span><div class="seg multi" role="group" aria-labelledby="lblStrings">' + [6, 5, 4, 3, 2, 1].map(s => '<button data-s="' + s + '" aria-pressed="' + (cfg.strings.indexOf(s) >= 0) + '" aria-label="' + ordinal(s) + ' string">' + s + '<small>' + letterName(STRING_LETTER[s], NS() === 'solfege' ? 'solfege' : 'letters') + '</small></button>').join('') + '</div></div>' +
        '<div class="field"><span class="field-label" id="lblFrets">Frets</span><div class="seg" role="group" aria-labelledby="lblFrets">' + [0, 3, 5, 7, 12].map(f => '<button data-f="' + f + '" aria-pressed="' + (cfg.maxFret === f) + '">' + (f === 0 ? 'Open' : '0–' + f) + '</button>').join('') + '</div></div>' +
        '<label class="check"><input type="checkbox" id="cfgAcc"' + (cfg.accidentals ? ' checked' : '') + '> Include sharps and flats</label>' +
        '<p class="pr-summary" id="cfgSummary">' + notesSummary(cfg) + '</p>' +
      '</div>' +
      '<div class="mode-list">' + ['read', 'find', 'fret'].map(m => modeRow(m)).join('') + '</div>' +
    '</section>' +
    '<section class="pr-block"><h2 class="sec-title">Rhythm and keys</h2><div class="mode-list">' +
      modeRow('rhythm', '<div class="mode-opts"><label class="check small"><input type="checkbox" id="cfgRests"' + (P.rhythm.rests ? ' checked' : '') + '> Rests</label><label class="check small"><input type="checkbox" id="cfgDots"' + (P.rhythm.dotted ? ' checked' : '') + '> Dotted notes</label></div>') +
      modeRow('keys', '<div class="mode-opts"><span class="opt-label" id="lblKeys">Up to</span><div class="seg small" role="group" aria-labelledby="lblKeys">' + [1, 2, 3, 4].map(n => '<button data-k="' + n + '" aria-pressed="' + (P.keys.max === n) + '">' + n + '</button>').join('') + '</div><span class="opt-label">sharps or flats</span></div>') +
    '</div></section></section>';
  const root = main.firstElementChild;
  const cfgFor = m => m === 'rhythm' ? Store.data.practice.rhythm : m === 'keys' ? Store.data.practice.keys : Store.data.practice.notes;
  function saveNotes(c) { Store.setPractice('notes', c); viewPractice(main); }
  root.addEventListener('click', e => {
    const sb = e.target.closest('[data-s]');
    if (sb) {
      const s = +sb.dataset.s, c = clone(cfg), i = c.strings.indexOf(s);
      if (i >= 0) { if (c.strings.length > 1) c.strings.splice(i, 1); } else c.strings.push(s);
      c.strings.sort();
      saveNotes(c); return;
    }
    const fb = e.target.closest('[data-f]');
    if (fb) { const c = clone(cfg); c.maxFret = +fb.dataset.f; saveNotes(c); return; }
    const kb = e.target.closest('[data-k]');
    if (kb) { Store.setPractice('keys', { max: +kb.dataset.k }); viewPractice(main); return; }
    const st = e.target.closest('[data-start]');
    if (st) { startPractice(st.dataset.start, cfgFor(st.dataset.start)); return; }
    const ch = e.target.closest('[data-challenge]');
    if (ch) startChallenge(ch.dataset.challenge, cfgFor(ch.dataset.challenge));
  });
  root.addEventListener('change', e => {
    if (e.target.id === 'cfgAcc') { const c = clone(cfg); c.accidentals = e.target.checked; saveNotes(c); }
    if (e.target.id === 'cfgRests' || e.target.id === 'cfgDots') Store.setPractice('rhythm', { rests: $('#cfgRests', root).checked, dotted: $('#cfgDots', root).checked });
  });
}

/* ---------- Progress ---------- */
function combinedMastery(keys) {
  const order = { weak: 0, ok: 1, strong: 2 };
  const ms = keys.map(k => Store.mastery(k)).filter(m => m !== 'new');
  if (!ms.length) return 'new';
  return ms.sort((a, b) => order[a] - order[b])[0];
}
const MASTERY_WORD = { new: 'Not tried yet', weak: 'Needs practice', ok: 'Getting there', strong: 'Known' };
function viewProgress(main) {
  const t = Store.totals();
  const pct = t.n ? Math.round(t.c / t.n * 100) + '%' : '–';
  const stars = LEVELS.reduce((a, l) => a + Store.levelStars(l.id), 0);
  const done = LEVELS.filter(l => Store.levelStars(l.id)).length;
  const streak = Store.dayStreak();
  const stat = (v, l) => '<div class="stat"><b>' + v + '</b><span>' + l + '</span></div>';
  main.innerHTML = '<section class="view progress">' +
    '<header class="view-head"><h1 class="title">Progress</h1><p class="lede">' + (Cloud.state.mode === 'account' ? 'Saved to your account, so your phone and computer share the same progress.' : 'Saved in this browser.') + '</p></header>' +
    '<div class="stats">' + stat(Store.xpTotal(), 'points in total') + stat(stars + '/' + LEVELS.length * 3, 'stars') + stat(streak, streak === 1 ? 'day in a row' : 'days in a row') + stat(done + '/' + LEVELS.length, 'levels finished') + '</div>' +
    '<p class="pg-line">' + t.n + ' notes, rhythms and keys answered, ' + pct + ' of them right.</p>' +
    '<div class="legend" aria-label="Colour key">' + ['strong', 'ok', 'weak', 'new'].map(m => '<span class="lg m-' + m + '"><i></i>' + MASTERY_WORD[m] + '</span>').join('') + '</div>' +
    '<section class="pg-sec"><div class="pg-head"><h2 class="sec-title">Notes on the staff</h2><p class="hint">From reading notes and finding them on the guitar.</p></div><div class="paper pg-staff" id="pgStaff"></div></section>' +
    '<section class="pg-sec"><div class="pg-head"><h2 class="sec-title">Spots on the fretboard</h2><p class="hint">From naming frets.</p></div><div class="board-card"><div class="fb-wrap" id="pgBoard"></div></div></section>' +
    '<section class="pg-sec"><div class="pg-head"><h2 class="sec-title">Note lengths</h2></div><div class="chips" id="pgRhythm"></div></section>' +
    '<section class="pg-sec"><div class="pg-head"><h2 class="sec-title">Key signatures</h2></div><div class="chips" id="pgKeys"></div></section>' +
    '<div class="pg-foot"><button class="btn ghost danger" data-act="reset">Reset progress</button></div></section>';
  const root = main.firstElementChild;
  function draw() {
    const host = $('#pgStaff', root);
    const rows = isPhone() ? [[-7, 3], [4, 14]] : [[-7, 14]];
    host.innerHTML = rows.map((r, i) => '<div class="pg-row" data-row="' + i + '"></div>').join('');
    rows.forEach((r, i) => {
      const items = [];
      for (let p = r[0]; p <= r[1]; p++) {
        const pt = pitchAt(p, 0), id = pitchId(pt);
        items.push({ kind: 'note', p, dur: 'w', cls: 'm-' + combinedMastery(['read:' + id, 'find:' + id]), label: nmShort(pt) });
      }
      mountStaff($('[data-row="' + i + '"]', host), { clef: 'g8', items, gap: 2.55, padR: 0.5, yRange: [-3.6, 8.2], aria: 'Notes from low E to high E, coloured by how well you know them' }, isPhone() ? 9.5 : 10.5);
    });
    const dots = [];
    for (let s = 1; s <= 6; s++) for (let f = 0; f <= 12; f++) {
      const m = Store.mastery('fret:' + s + '-' + f);
      if (m === 'new') continue;
      const sp = spellings(posMidi(s, f));
      dots.push({ s, f, text: sp.length === 1 ? nmShort(sp[0]) : '', r: sp.length === 1 ? 12.5 : 7, cls: 'mk-m-' + m, title: posLabel(s, f) + ': ' + MASTERY_WORD[m] });
    }
    mountFretboard($('#pgBoard', root), { maxFret: 12, dots, names: NS(), showZero: true, aria: 'Fretboard coloured by how well you know each spot' });
    $('#pgRhythm', root).innerHTML = RHYTHM_ITEMS.map(it => { const m = Store.mastery('rhy:' + it.id); return '<span class="chip m-' + m + '" title="' + MASTERY_WORD[m] + '"><i></i>' + capFirst(rhythmName(it)) + '</span>'; }).join('');
    $('#pgKeys', root).innerHTML = KEYS.map(k => { const m = Store.mastery('key:' + k.id); return '<span class="chip m-' + m + '" title="' + MASTERY_WORD[m] + '"><i></i>' + keyName(k, NS()) + '</span>'; }).join('');
  }
  root.addEventListener('click', e => {
    if (e.target.closest('[data-act="reset"]')) openConfirm('Reset all progress?', 'Your points, stars, answers and round results will be cleared ' + (Cloud.state.mode === 'account' ? 'on every device' : 'in this browser') + '. Settings stay as they are.', 'Reset progress', () => { Store.reset(); render(false); });
  });
  draw(); addResizer(draw);
}

/* ---------- Dialogs ---------- */
let lastFocus = null;
function openSheet(el) {
  lastFocus = document.activeElement;
  el.hidden = false;
  const f = el.querySelector('input, button');
  if (f) f.focus();
}
function closeSheet(el) { el.hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
function openConfirm(title, text, okLabel, onOk) {
  const el = $('#confirm');
  $('#confirmTitle').textContent = title;
  $('#confirmText').textContent = text;
  const ok = $('#confirmOk');
  ok.textContent = okLabel;
  ok.onclick = () => { closeSheet(el); onOk(); };
  openSheet(el);
}
function syncSettingsForm() {
  const s = Store.settings;
  $$('input[name="names"]').forEach(r => { r.checked = r.value === s.names; });
  $('#setSound').checked = s.sound;
  $('#setAuto').checked = s.autoNext;
}
function runKey(e) {
  const R = App.run;
  if (!R || R.done || App.route !== R.origin) return;
  const t = e.target;
  if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  const c = R.card, st = R.st;
  if (e.key === 'Enter' || e.key === ' ') {
    if (t && t.tagName === 'BUTTON') return;
    e.preventDefault();
    if (c.t === 'teach' || st.answered) { if (R.kind !== 'challenge') nextCard(); }
    else checkCard();
    return;
  }
  if (st.answered || c.t === 'teach') return;
  if (c.t === 'staffTap' && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); adjustTap(e.key === 'ArrowUp' ? 1 : -1); return; }
  if (!c.options || e.key.length !== 1) return;
  const l = LETTERS.indexOf(e.key.toUpperCase());
  if (l >= 0 && (c.layout === 'letters' || c.layout === 'chromatic')) {
    const i = c.options.findIndex(o => o.l === l || o.pc === LETTER_SEMIS[l]);
    if (i >= 0) { e.preventDefault(); answerCard(i); }
    return;
  }
  if (/^[1-9]$/.test(e.key) && c.layout !== 'letters') {
    const d = +e.key;
    let i = d - 1;
    if (c.layout === 'beats') i = c.options.findIndex(o => o.b === d);
    else if (c.layout === 'strings') i = c.options.findIndex(o => o.s === d);
    if (i >= 0 && i < c.options.length) { e.preventDefault(); answerCard(i); }
  }
}
function initShell() {
  installGlyphSprite();
  const settings = $('#settings'), confirmEl = $('#confirm');
  $('#btnSettings').addEventListener('click', () => { syncSettingsForm(); openSheet(settings); });
  settings.addEventListener('change', e => {
    if (e.target.name === 'names') { Store.setSetting('names', e.target.value); if (App.run && !App.run.done && App.route === App.run.origin) { renderCard(); } else render(false); }
    if (e.target.id === 'setSound') { Store.setSetting('sound', e.target.checked); Sound.setEnabled(e.target.checked); }
    if (e.target.id === 'setAuto') Store.setSetting('autoNext', e.target.checked);
  });
  [settings, confirmEl].forEach(el => {
    el.addEventListener('click', e => { if (e.target === el || e.target.closest('[data-close]')) closeSheet(el); });
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { [settings, confirmEl].forEach(el => { if (!el.hidden) closeSheet(el); }); }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (!settings.hidden || !confirmEl.hidden) return;
    runKey(e);
  });
  document.addEventListener('pointerdown', () => Sound.unlock(), { once: true, capture: true });
  let lastW = window.innerWidth, timer = null;
  window.addEventListener('resize', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (Math.abs(window.innerWidth - lastW) < 2) return;
      lastW = window.innerWidth;
      App.resizers.forEach(fn => { try { fn(); } catch (err) { console.error(err); } });
    }, 140);
  });
  window.addEventListener('hashchange', () => { App.route = parseHash(); render(true); });
}
function start(data) {
  data = data || {};
  if (data.ex && typeof data.ex.p === 'number') App.ex = Object.assign(App.ex, data.ex);
  initShell();
  Sound.setEnabled(Store.settings.sound);
  App.route = parseHash();
  render(true);
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ ex: App.ex })); } catch (e) { /* not in the viewer */ }
  Cloud.init(() => {
    Sound.setEnabled(Store.settings.sound);
    const r = App.route;
    if (!App.run && (r === 'progress' || r === 'play' || r === 'practice')) render(false);
  });
}
(function boot() {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start(hot && hot.data ? hot.data : {});
})();

</script>
