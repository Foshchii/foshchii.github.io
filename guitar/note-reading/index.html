  const holder = document.createElement('div');
  holder.innerHTML = '<svg width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" focusable="false"><defs>' + defs +
    '<linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--wood-1)"/><stop offset="0.5" style="stop-color:var(--wood-2)"/><stop offset="1" style="stop-color:var(--wood-3)"/></linearGradient>' +
    '<linearGradient id="fretGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--fret-1)"/><stop offset="0.5" style="stop-color:var(--fret-2)"/><stop offset="1" style="stop-color:var(--fret-1)"/></linearGradient>' +
    '<radialGradient id="pearlGrad" cx="0.35" cy="0.35" r="0.75"><stop offset="0" style="stop-color:var(--inlay-1)"/><stop offset="1" style="stop-color:var(--inlay-2)"/></radialGradient>' +
    '</defs></svg>';
  document.body.appendChild(holder.firstChild);
}

/* ---------- Staff ---------- */
function staffSVG(spec) {
  const items = spec.items || [];
  const out = [];       /* shapes drawn over the staff lines */
  const labels = [];    /* deferred: placed on one baseline under everything */
  let minY = 0, maxY = 4;
  const grow = (a, b) => { if (a < minY) minY = a; if (b > maxY) maxY = b; };
  let x = 0.7;

  if (spec.clef) {
    const g = spec.clef === 'g8' ? 'gClef8vb' : 'gClef';
    out.push(use(g, x, 3, ' class="clef"'));
    grow(3 + GLYPHS[g].b[1], 3 + GLYPHS[g].b[3]);
    x += gw(g) + 0.9;
  }
  const n = spec.key || 0;
  if (n) {
    const pos = n > 0 ? SHARP_POS : FLAT_POS;
    const g = n > 0 ? 'accidentalSharp' : 'accidentalFlat';
    const step = n > 0 ? 1.05 : 0.95;
    for (let i = 0; i < Math.abs(n); i++) {
      const y = yOf(pos[i]);
      out.push(use(g, x + i * step, y, ' class="keysig"'));
      grow(y + GLYPHS[g].b[1], y + GLYPHS[g].b[3]);
    }
    x += Math.abs(n) * step + 0.7;
  }
  if (spec.time) {
    if (spec.time === 'C') {
      out.push(use('timeSigCommon', x, 2));
      x += gw('timeSigCommon') + 1.1;
    } else {
      const t = String(spec.time[0]), b = String(spec.time[1]);
      const wid = s => s.split('').reduce((a, d) => a + gw('timeSig' + d), 0);
      const W = Math.max(wid(t), wid(b));
      const put = (s, y) => { let xx = x + (W - wid(s)) / 2; s.split('').forEach(d => { out.push(use('timeSig' + d, xx, y)); xx += gw('timeSig' + d); }); };
      put(t, 1); put(b, 3);
      x += W + 1.1;
    }
  }
  const contentStart = x;
  const gap = spec.gap || 3.2;
  const beatW = spec.beatW || 0;

  /* First pass: x positions */
  const geo = items.map(it => ({ it }));
  geo.forEach(gm => {
    const it = gm.it;
    if (it.kind === 'bar') { x += 0.5; gm.x = x; x += it.style === 'final' ? 0.8 : 1.1; return; }
    if (it.kind === 'gap') { gm.x = x; x += it.w || 1; return; }
    if (it.kind === 'slot') { gm.x = x; x += it.w || 3.6; return; }
    if (it.kind === 'acc') { gm.x = x; x += it.w || 1.5; return; }
    const accW = (it.kind === 'note' && it.acc !== undefined && it.acc !== null) ? gw(ACC_GLYPH[it.acc]) + 0.28 : 0;
    const headW = it.kind === 'note' ? gw(HEAD[it.dur || 'w']) : gw(REST[it.dur || 'q']);
    if (it.x !== undefined) { gm.x = it.x; x = Math.max(x, it.x + headW + 0.6); return; }
    gm.x = x + accW;
    const slot = it.w !== undefined ? it.w : beatW ? durBeats(it.dur, it.dots) * beatW : gap;
    x += Math.max(slot, accW + headW + 0.6);
  });
  let W = Math.max(x + (spec.padR !== undefined ? spec.padR : 0.6), spec.width || 0);
  if (spec.center && geo.length === 1 && geo[0].it.x === undefined) {
    const it = geo[0].it;
    const headW = it.kind === 'note' ? gw(HEAD[it.dur || 'w']) : gw(REST[it.dur || 'q']);
    geo[0].x = contentStart + (W - contentStart) / 2 - headW / 2;
  } else if (spec.centerGroup && geo.length && !geo.some(g => g.it.x !== undefined)) {
    const free = W - (spec.padR !== undefined ? spec.padR : 0.6) - x;
    if (free > 0.5) geo.forEach(g => { g.x += free / 2; });
  }

  /* Stem direction and beam groups */
  const beams = {};
  geo.forEach((gm, i) => {
    const it = gm.it;
    if (it.kind !== 'note' || it.dur === 'w') return;
    if (it.beam !== undefined) (beams[it.beam] = beams[it.beam] || []).push(i);
  });
  Object.values(beams).forEach(idx => {
    const avg = idx.reduce((a, i) => a + geo[i].it.p, 0) / idx.length;
    const dir = geo[idx[0]].it.stem || (avg < 4 ? 'up' : 'down');
    const ys = idx.map(i => yOf(geo[i].it.p));
    const by = dir === 'up' ? Math.min.apply(null, ys) - 3.5 : Math.max.apply(null, ys) + 3.5;
    idx.forEach(i => { geo[i].dir = dir; geo[i].stemEnd = by; geo[i].beamed = true; });
    const first = geo[idx[0]], last = geo[idx[idx.length - 1]];
    const sx = g => dir === 'up' ? g.x + 1.18 - ENG.stem : g.x;
    const x1 = sx(first), x2 = sx(last) + ENG.stem;
    const levels = geo[idx[0]].it.dur === 's' ? 2 : 1;
    for (let k = 0; k < levels; k++) {
      const yy = dir === 'up' ? by + k * ENG.beamStep : by - k * ENG.beamStep - ENG.beam;
      out.push('<rect class="beam" x="' + n3(x1) + '" y="' + n3(yy) + '" width="' + n3(x2 - x1) + '" height="' + ENG.beam + '" data-beam="' + idx[0] + '"/>');
      grow(yy, yy + ENG.beam);
    }
  });

  /* Second pass: draw */
  const noteGeo = [];
  geo.forEach((gm, i) => {
    const it = gm.it;
    if (it.kind === 'gap') return;
    if (it.kind === 'acc') {
      const ag = ACC_GLYPH[it.acc === undefined ? 1 : it.acc], ay = yOf(it.p);
      out.push('<g class="nt' + (it.cls ? ' ' + it.cls : '') + '">' + use(ag, gm.x, ay) + '</g>');
      grow(ay + GLYPHS[ag].b[1], ay + GLYPHS[ag].b[3]);
      noteGeo.push({ i, x: gm.x, w: gw(ag), y: ay, p: it.p });
      return;
    }
    if (it.kind === 'slot') {
      out.push('<rect class="mslot' + (it.cls ? ' ' + it.cls : '') + '" x="' + n3(gm.x + 0.25) + '" y="-1.1" width="' + n3((it.w || 3.6) - 0.5) + '" height="6.2" rx="0.55"/>');
      grow(-1.2, 5.2);
      return;
    }
    if (it.kind === 'bar') {
      if (it.style === 'final') {
        out.push('<rect x="' + n3(gm.x) + '" y="0" width="' + ENG.thin + '" height="4" class="bar"/>');
        out.push('<rect x="' + n3(gm.x + 0.56) + '" y="0" width="' + ENG.thick + '" height="4" class="bar"/>');
      } else out.push('<rect x="' + n3(gm.x) + '" y="0" width="' + ENG.thin + '" height="4" class="bar"/>');
      return;
    }
    const parts = [];
    const color = it.color ? ' style="color:' + it.color + '"' : '';
    const hitAttr = it.hit ? ' data-i="' + i + '"' : '';
    let top = 99, bot = -99;
    const g2 = (a, b) => { if (a < top) top = a; if (b > bot) bot = b; };
    if (it.kind === 'rest') {
      const name = REST[it.dur || 'q'];
      const y = it.dur === 'w' ? 1 : 2;
      parts.push(use(name, gm.x, y));
      g2(y + GLYPHS[name].b[1], y + GLYPHS[name].b[3]);
      if (it.dots) { parts.push(use('augmentationDot', gm.x + gw(name) + 0.35, 1.5)); }
      noteGeo.push({ i, x: gm.x, w: gw(name) });
    } else {
      const p = it.p, y = yOf(p);
      const head = HEAD[it.dur || 'w'];
      const hw = gw(head);
      /* ledger lines */
      for (let q = -2; q >= p; q -= 2) { const ly = yOf(q); parts.push('<rect class="ledger" x="' + n3(gm.x - ENG.ledgerExt) + '" y="' + n3(ly - ENG.ledger / 2) + '" width="' + n3(hw + 2 * ENG.ledgerExt) + '" height="' + ENG.ledger + '"/>'); }
      for (let q = 10; q <= p; q += 2) { const ly = yOf(q); parts.push('<rect class="ledger" x="' + n3(gm.x - ENG.ledgerExt) + '" y="' + n3(ly - ENG.ledger / 2) + '" width="' + n3(hw + 2 * ENG.ledgerExt) + '" height="' + ENG.ledger + '"/>'); }
      if (it.acc !== undefined && it.acc !== null) {
        const ag = ACC_GLYPH[it.acc];
        parts.push(use(ag, gm.x - gw(ag) - 0.28, y));
        g2(y + GLYPHS[ag].b[1], y + GLYPHS[ag].b[3]);
      }
      parts.push(use(head, gm.x, y, ' class="head"'));
      g2(y - 0.5, y + 0.5);
      let flagUp = false;
      if (it.dur && it.dur !== 'w' && it.stem !== 'none') {
        const dir = gm.dir || it.stem || (p < 4 ? 'up' : 'down');
        if (dir === 'up') {
          let end = gm.stemEnd !== undefined ? gm.stemEnd : Math.min(y - 3.5, 2);
          const sx = gm.x + 1.18 - ENG.stem;
          parts.push('<rect class="stem" x="' + n3(sx) + '" y="' + n3(end) + '" width="' + ENG.stem + '" height="' + n3(y - 0.168 - end) + '"/>');
          g2(end, y);
          if (!gm.beamed && (it.dur === 'e' || it.dur === 's')) {
            const f = it.dur === 'e' ? 'flag8thUp' : 'flag16thUp';
            parts.push(use(f, sx, end - (it.dur === 'e' ? 0.04 : 0.088)));
            flagUp = true;
          }
          gm.stemTop = end;
        } else {
          let end = gm.stemEnd !== undefined ? gm.stemEnd : Math.max(y + 3.5, 2);
          const sx = gm.x;
          parts.push('<rect class="stem" x="' + n3(sx) + '" y="' + n3(y + 0.168) + '" width="' + ENG.stem + '" height="' + n3(end - y - 0.168) + '"/>');
          g2(y, end);
          if (!gm.beamed && (it.dur === 'e' || it.dur === 's')) {
            const f = it.dur === 'e' ? 'flag8thDown' : 'flag16thDown';
            parts.push(use(f, sx, end + (it.dur === 'e' ? 0.132 : 0.128)));
          }
          gm.stemTop = y - 0.5;
        }
      } else gm.stemTop = y - 0.5;
      if (it.dots) {
        const dy = (p % 2 === 0) ? y - 0.5 : y;
        parts.push(use('augmentationDot', gm.x + (flagUp ? 2.35 : hw + 0.35), dy));
      }
      if (it.tag) {
        const tx = gm.x + hw + (it.dots ? 1.2 : 0.8) + (flagUp ? 0.9 : 0);
        parts.push('<text class="tag" x="' + n3(tx) + '" y="' + n3(y + 0.62) + '">' + esc(it.tag) + '</text>');
      }
      let markBase = Math.min(top, -0.3) - 0.5;
      if (it.above) {
        const ty = Math.min(gm.stemTop, y - 0.5, -0.3) - 0.55;
        parts.push('<text class="fing" x="' + n3(gm.x + hw / 2) + '" y="' + n3(ty) + '" text-anchor="middle">' + esc(it.above) + '</text>');
        g2(ty - 1.1, ty);
        markBase = ty - 1.4;
      }
      if (it.mark) {
        parts.push('<text class="posmark" x="' + n3(gm.x - 0.2) + '" y="' + n3(markBase) + '">' + esc(it.mark) + '</text>');
        g2(markBase - 1.5, markBase);
      }
      noteGeo.push({ i, x: gm.x, w: hw, y, p, dir: gm.dir || (p < 4 ? 'up' : 'down') });
    }
    grow(top, bot);
    out.push('<g class="nt' + (it.cls ? ' ' + it.cls : '') + '"' + color + hitAttr + '>' + parts.join('') +
      (it.hit ? '<rect class="nt-hit" x="' + n3(gm.x - 0.9) + '" y="' + n3(Math.min(top, -0.5) - 0.3) + '" width="' + n3((it.kind === 'note' ? gw(HEAD[it.dur || 'w']) : 1.2) + 1.8) + '" height="' + n3(Math.max(bot, 4.5) - Math.min(top, -0.5) + 0.6) + '"/>' : '') + '</g>');
  });

  /* Ties */
  geo.forEach((gm, i) => {
    if (!gm.it.tie) return;
    let j = i + 1;
    while (j < geo.length && geo[j].it.kind !== 'note') j++;
    if (j >= geo.length) return;
    const a = gm, b = geo[j];
    const y = yOf(a.it.p);
    const dir = (a.dir || (a.it.p < 4 ? 'up' : 'down')) === 'up' ? 1 : -1;
    const x1 = a.x + gw(HEAD[a.it.dur]) * 0.8, x2 = b.x + gw(HEAD[b.it.dur]) * 0.2;
    const w = x2 - x1, yy = y + dir * 0.6;
    const h = Math.max(0.45, Math.min(0.85, 0.3 + w * 0.08));
    const d1 = h / 0.75, d2 = (h - 0.2) / 0.75;
    out.push('<path class="tie" d="M' + n3(x1) + ' ' + n3(yy) + 'C' + n3(x1 + w * 0.25) + ' ' + n3(yy + dir * d1) + ' ' + n3(x2 - w * 0.25) + ' ' + n3(yy + dir * d1) + ' ' + n3(x2) + ' ' + n3(yy) +
      'C' + n3(x2 - w * 0.25) + ' ' + n3(yy + dir * d2) + ' ' + n3(x1 + w * 0.25) + ' ' + n3(yy + dir * d2) + ' ' + n3(x1) + ' ' + n3(yy) + 'Z"/>');
    grow(yy - 1, yy + 1);
  });

  if (spec.endBar === 'final') {
    out.push('<rect x="' + n3(W - 0.85) + '" y="0" width="' + ENG.thin + '" height="4" class="bar"/><rect x="' + n3(W - ENG.thick) + '" y="0" width="' + ENG.thick + '" height="4" class="bar"/>');
  } else if (spec.endBar === 'single') {
    out.push('<rect x="' + n3(W - ENG.thin) + '" y="0" width="' + ENG.thin + '" height="4" class="bar"/>');
  }

  if (spec.yRange) { grow(spec.yRange[0], spec.yRange[1]); }

  /* Labels under the staff, on one baseline */
  const hasCircles = items.some(it => it.circle);
  let circleY = maxY + 1.25;
  if (hasCircles) {
    noteGeo.forEach(ng => {
      const it = items[ng.i];
      if (!it.circle) return;
      const cx = ng.x + ng.w / 2;
      labels.push('<g class="strnum"><circle cx="' + n3(cx) + '" cy="' + n3(circleY) + '" r="0.8"/><text x="' + n3(cx) + '" y="' + n3(circleY + 0.42) + '" text-anchor="middle">' + esc(it.circle) + '</text></g>');
    });
    maxY = circleY + 0.9;
  }
  const hasLabels = items.some(it => it.label) || spec.reserveLabel;
  if (hasLabels) {
    const ly = Math.max(maxY, 4) + 1.9;
    noteGeo.forEach(ng => {
      const it = items[ng.i];
      if (!it.label) return;
      const start = it.labelAlign === 'start';
      const cx = start ? ng.x : ng.x + ng.w / 2;
      const lines = String(it.label).split('\n');
      labels.push('<text class="lbl' + (it.labelCls ? ' ' + it.labelCls : '') + '" x="' + n3(cx) + '" y="' + n3(ly) + '" text-anchor="' + (start ? 'start' : 'middle') + '">' +
        lines.map((t, k) => '<tspan x="' + n3(cx) + '" dy="' + (k ? 1.35 : 0) + '"' + (k ? ' class="lbl2"' : '') + '>' + esc(t) + '</tspan>').join('') + '</text>');
    });
    const nLines = Math.max.apply(null, [1].concat(items.map(it => it.label ? String(it.label).split('\n').length : 1)));
    maxY = ly + 0.5 + (nLines - 1) * 1.35;
  }

  const lines = [];
  for (let k = 0; k < 5; k++) lines.push('<rect class="sl" x="0" y="' + n3(k - ENG.line / 2) + '" width="' + n3(W) + '" height="' + ENG.line + '"/>');
  const y0 = minY - 0.4, H = maxY - minY + 0.8;
  const svg = '<svg class="staff' + (spec.cls ? ' ' + spec.cls : '') + '" viewBox="0 ' + n3(y0) + ' ' + n3(W) + ' ' + n3(H) + '" role="img" aria-label="' + esc(spec.aria || 'Music staff') + '">' +
    lines.join('') + out.join('') + labels.join('') + '</svg>';
  return { svg, W, H, contentStart, noteGeo };
}

/* Render a staff into an element at a given size per staff space (px). */
function mountStaff(el, spec, spPx, opts) {
  opts = opts || {};
  const avail = el.clientWidth || 320;
  const s = Object.assign({}, spec);
  if (opts.stretch) s.width = Math.max(avail / spPx, 6);
  const r = staffSVG(s);
  let scale = spPx;
  if (r.W * scale > avail && opts.shrink !== false) scale = avail / r.W;
  el.innerHTML = r.svg;
  const svg = el.firstChild;
  svg.setAttribute('width', Math.round(r.W * scale));
  svg.setAttribute('height', Math.round(r.H * scale));
  return { svg, r, scale };
}

/* A single note or rest as a small picture, for answer buttons. */
function symbolSVG(it, px) {
  const r = staffSVG({ items: [Object.assign({ p: 3 }, it, { kind: it.rest ? 'rest' : 'note' })], padR: 0.5, cls: 'sym', yRange: [-0.8, 4.8], aria: '' });
  px = px || 6.5;
  return r.svg.replace('<svg ', '<svg width="' + Math.round(r.W * px) + '" height="' + Math.round(r.H * px) + '" aria-hidden="true" ');
}

/* Convert a pointer event to the staff position under it. */
function staffPosFromEvent(svg, ev) {
  const pt = svg.createSVGPoint();
  pt.x = ev.clientX; pt.y = ev.clientY;
  const m = svg.getScreenCTM();
  if (!m) return null;
  const loc = pt.matrixTransform(m.inverse());
  return { p: Math.round(8 - loc.y * 2), x: loc.x };
}

/* ---------- Fretboard ---------- */
const STRING_W = [0, 1.0, 1.2, 1.5, 1.9, 2.3, 2.8];
function fretboardSVG(o) {
  const maxFret = o.maxFret === undefined ? 12 : o.maxFret;
  const LBL = 26, OPEN = 42, FW = o.fw || 56, GAP = o.gap || 32, TOP = 18, BOT = 30, END = 14;
  const nutX = LBL + OPEN;
  const W = nutX + maxFret * FW + END;
  const H = TOP + 5 * GAP + BOT;
  const sy = s => TOP + (s - 1) * GAP;
  const fx = f => f === 0 ? LBL + OPEN / 2 - 3 : nutX + (f - 0.5) * FW;
  const p = [];
  const boardTop = sy(1) - 13, boardBot = sy(6) + 13;
  const boardR = nutX + maxFret * FW + END;
  p.push('<rect class="fb-board" x="' + nutX + '" y="' + boardTop + '" width="' + (boardR - nutX) + '" height="' + (boardBot - boardTop) + '" fill="url(#woodGrad)"/>');
  /* grain */
  let seed = 11 + maxFret;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  for (let k = 0; k < 9; k++) {
    const y = boardTop + 6 + rnd() * (boardBot - boardTop - 12);
    let d = 'M' + nutX + ' ' + y.toFixed(1);
    for (let xx = nutX + 40; xx <= boardR; xx += 40) d += ' Q' + (xx - 20) + ' ' + (y + (rnd() - 0.5) * 5).toFixed(1) + ' ' + xx + ' ' + (y + (rnd() - 0.5) * 3).toFixed(1);
    p.push('<path class="fb-grain" d="' + d + '"/>');
  }
  /* inlays */
  const midY = (sy(3) + sy(4)) / 2;
  for (let f = 1; f <= maxFret; f++) {
    const cx = nutX + (f - 0.5) * FW;
    if ([3, 5, 7, 9, 15, 17, 19, 21].indexOf(f) >= 0) p.push('<circle class="fb-inlay" cx="' + cx + '" cy="' + midY + '" r="6" fill="url(#pearlGrad)"/>');
    if (f === 12 || f === 24) {
      p.push('<circle class="fb-inlay" cx="' + cx + '" cy="' + (sy(2) + sy(3)) / 2 + '" r="6" fill="url(#pearlGrad)"/>');
      p.push('<circle class="fb-inlay" cx="' + cx + '" cy="' + (sy(4) + sy(5)) / 2 + '" r="6" fill="url(#pearlGrad)"/>');
    }
  }
  /* frets and nut */
  for (let f = 1; f <= maxFret; f++) {
    const x = nutX + f * FW;
    p.push('<rect class="fb-fret" x="' + (x - 1.6) + '" y="' + boardTop + '" width="3.2" height="' + (boardBot - boardTop) + '" fill="url(#fretGrad)"/>');
  }
  p.push('<rect class="fb-nut" x="' + (nutX - 6) + '" y="' + (boardTop - 1) + '" width="6" height="' + (boardBot - boardTop + 2) + '" rx="1"/>');
  /* strings */
  for (let s = 1; s <= 6; s++) {
    const y = sy(s), w = STRING_W[s];
    const dim = o.activeStrings && o.activeStrings.indexOf(s) < 0;
    const cls = (s >= 4 ? 'fb-str wound' : 'fb-str plain') + (dim ? ' dim' : '');
    p.push('<line class="' + cls + '" x1="' + (LBL + 2) + '" y1="' + y + '" x2="' + (boardR) + '" y2="' + y + '" stroke-width="' + w + '"/>');
    if (s >= 4) p.push('<line class="fb-wind' + (dim ? ' dim' : '') + '" x1="' + (LBL + 2) + '" y1="' + y + '" x2="' + boardR + '" y2="' + y + '" stroke-width="' + (w * 0.55) + '"/>');
    const nm = letterName(STRING_LETTER[s], o.names === 'solfege' ? 'solfege' : 'letters');
    p.push('<text class="fb-slbl' + (dim ? ' dim' : '') + '" x="' + (LBL / 2 - 1) + '" y="' + (y + 4.5) + '" text-anchor="middle">' + nm + '</text>');
  }
  /* fret numbers */
  for (let f = 0; f <= maxFret; f++) {
    const strong = [3, 5, 7, 9, 12, 15].indexOf(f) >= 0;
    if (f === 0 && !o.showZero) continue;
    p.push('<text class="fb-fnum' + (strong ? ' strong' : '') + '" x="' + fx(f) + '" y="' + (boardBot + 17) + '" text-anchor="middle">' + (f === 0 ? '0' : f) + '</text>');
  }
  /* markers */
  (o.dots || []).forEach(d => {
    if (d.f > maxFret) return;
    const cx = fx(d.f), cy = sy(d.s);
    const r = d.r || 12.5;
    let inner = '<circle r="' + r + '"/>';
    if (d.cls && d.cls.indexOf('ask') >= 0) inner = '<circle class="ring" r="' + (r + 3) + '"/>' + inner;
    const txt = d.text === undefined ? '' : String(d.text);
    const fs = txt.length > 4 ? 8.5 : txt.length > 2 ? 10 : 12.5;
    p.push('<g class="mk ' + (d.cls || 'mk-accent') + '" transform="translate(' + cx + ' ' + cy + ')"' + (d.title ? ' aria-label="' + esc(d.title) + '"' : '') + '>' + inner +
      (txt ? '<text y="' + (fs * 0.36).toFixed(1) + '" text-anchor="middle" style="font-size:' + fs + 'px">' + esc(txt) + '</text>' : '') + '</g>');
  });
  /* hit targets */
  if (o.interactive) {
    for (let s = 1; s <= 6; s++) {
      for (let f = 0; f <= maxFret; f++) {
        const x0 = f === 0 ? LBL : nutX + (f - 1) * FW;
        const w = f === 0 ? OPEN - 4 : FW;
        p.push('<rect class="hit" x="' + x0 + '" y="' + (sy(s) - GAP / 2) + '" width="' + w + '" height="' + GAP + '" data-s="' + s + '" data-f="' + f + '" tabindex="' + (o.focusable ? 0 : -1) + '" role="button" aria-label="' + posLabel(s, f) + '"/>');
      }
    }
  }
  return {
    svg: '<svg class="fb" viewBox="0 0 ' + W + ' ' + H + '" role="group" aria-label="' + esc(o.aria || 'Guitar fretboard') + '">' + p.join('') + '</svg>',
    W, H, fx, sy,
  };
}

/* Fit the fretboard to the container: wider frets when there is room, scroll when not. */
function mountFretboard(el, o) {
  const avail = Math.max(260, (el.clientWidth || 340));
  const maxFret = o.maxFret === undefined ? 12 : o.maxFret;
  const fixed = 26 + 42 + 14;
  let fw = (avail - fixed) / Math.max(maxFret, 1);
  fw = Math.max(o.minFw || 46, Math.min(o.maxFw || 72, fw));
  const r = fretboardSVG(Object.assign({}, o, { fw }));
  el.innerHTML = r.svg;
  const svg = el.firstChild;
  svg.setAttribute('width', Math.round(r.W));
  svg.setAttribute('height', Math.round(r.H));
  el.classList.toggle('scrolls', r.W > avail + 1);
  const edge = () => el.classList.toggle('at-end', el.scrollLeft + el.clientWidth >= el.scrollWidth - 2);
  if (!el._edgeWatch) { el._edgeWatch = true; el.addEventListener('scroll', edge, { passive: true }); }
  edge();
  return { svg, r };
}

/* ============================================================
   Sound: plucked-string synthesis and a small rhythm sequencer.
   Audio may only start from a tap or click; every call is guarded.
   ============================================================ */
const Sound = (() => {
  let ctx = null, master = null, enabled = true;
  const cache = new Map();
  let live = [];

  function ready() {
    if (!ctx) {
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* not supported */ }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      master = ctx.createGain();
      master.gain.value = 0.9;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 14; comp.ratio.value = 4;
      master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') { try { const p = ctx.resume(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* refused */ } }
    return ctx;
  }
  function buffer(midi) {
    let b = cache.get(midi);
    if (!b) {
      const data = pluckSamples(soundingFreq(midi), ctx.sampleRate);
      b = ctx.createBuffer(1, data.length, ctx.sampleRate);
      b.getChannelData(0).set(data);
      cache.set(midi, b);
    }
    return b;
  }
  /* midi = written pitch; the guitar sounds an octave lower, handled by soundingFreq */
  function note(midi, o) {
    o = o || {};
    if (!enabled) return null;
    const c = ready();
    if (!c) return null;
    try {
      const t = o.at || c.currentTime + 0.015;
      const src = c.createBufferSource();
      src.buffer = buffer(midi);
      const g = c.createGain();
      const vol = o.vol || 0.85;
      g.gain.setValueAtTime(vol, t);
      src.connect(g); g.connect(master);
      src.start(t);
      if (o.dur) {
        const end = t + o.dur;
        g.gain.setValueAtTime(vol, Math.max(t + 0.01, end - 0.06));
        g.gain.linearRampToValueAtTime(0.0001, end);
        src.stop(end + 0.03);
      }
      live.push(src);
      src.onended = () => { live = live.filter(s => s !== src); };
      return src;
    } catch (e) { return null; }
  }
  function click(at, strong) {
    const c = ready();
    if (!c || !enabled) return;
    try {
      const osc = c.createOscillator(), g = c.createGain();
      osc.type = 'triangle';
      osc.frequency.value = strong ? 1760 : 1175;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(strong ? 0.32 : 0.18, at + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.06);
      osc.connect(g); g.connect(master);
      osc.start(at); osc.stop(at + 0.08);
      live.push(osc);
      osc.onended = () => { live = live.filter(s => s !== osc); };
    } catch (e) { /* ignore */ }
  }
  function strum(midis, gap) {
    const c = ready();
    if (!c) return;
    const t = c.currentTime + 0.03;
    midis.forEach((m, i) => note(m, { at: t + i * (gap || 0.05), vol: 0.62 }));
  }
  function stopAll() { live.forEach(s => { try { s.stop(); } catch (e) { /* already stopped */ } }); live = []; }
  /* Short game sounds built from the same plucked string. */
  function fx(kind) {
    const c = ready();
    if (!c || !enabled) return;
    const t = c.currentTime + 0.012;
    if (kind === 'good') { note(81, { at: t, vol: 0.4, dur: 0.55 }); note(85, { at: t + 0.085, vol: 0.45, dur: 0.9 }); }
    else if (kind === 'bad') { note(55, { at: t, vol: 0.55, dur: 0.14 }); note(54, { at: t + 0.11, vol: 0.5, dur: 0.28 }); }
    else if (kind === 'done') [76, 80, 83, 88].forEach((m, i) => note(m, { at: t + i * 0.09, vol: 0.5, dur: 1.3 }));
  }

  /* events: [{beats (in quarter notes), rest, midi, tie}] */
  function rhythm(events, o) {
    o = o || {};
    const c = ready();
    const timers = [];
    if (!c || !enabled) { if (o.onEnd) setTimeout(o.onEnd, 0); return () => {}; }
    const spq = 60 / (o.bpm || 80);
    const unit = o.clickUnit || 1;
    const perBar = o.beatsPerBar || 4;
    const t = c.currentTime + 0.12;
    const t0 = t + (o.countIn ? perBar * unit * spq : 0);
    if (o.countIn) for (let b = 0; b < perBar; b++) click(t + b * unit * spq, b === 0);
    const total = events.reduce((a, e) => a + e.beats, 0);
    if (o.clicks !== false) for (let b = 0; b * unit < total - 1e-6; b++) click(t0 + b * unit * spq, b % perBar === 0);
    let acc = 0;
    events.forEach((e, i) => {
      const at = t0 + acc * spq;
      if (!e.rest && !e.held) note(e.midi, { at, dur: e.beats * spq * (e.tie ? 1 : 0.93) + (e.tie ? (e.tieBeats || 0) * spq * 0.93 : 0), vol: 0.8 });
      timers.push(setTimeout(() => { if (o.onStep) o.onStep(i); }, Math.max(0, (at - c.currentTime) * 1000)));
      acc += e.beats;
    });
    const end = t0 + acc * spq;
    timers.push(setTimeout(() => { if (o.onEnd) o.onEnd(); }, Math.max(0, (end - c.currentTime) * 1000 + 120)));
    return () => { timers.forEach(clearTimeout); stopAll(); if (o.onEnd) o.onEnd(); };
  }
  return {
    note, click, strum, rhythm, stopAll, fx,
    setEnabled(v) { enabled = !!v; if (!enabled) stopAll(); },
    unlock() { ready(); },
  };
})();

/* ============================================================
   Progress store: kept in this browser, and in the person's
   private space on their account when the page can reach it,
   so phone and computer share one history.
   ============================================================ */
const STORE_KEY = 'guitar-note-reading-v1';
const DEFAULT_SETTINGS = { names: 'letters', sound: true, autoNext: true };
const DEFAULT_PRACTICE = {
  notes: { strings: [1, 2, 3, 4, 5, 6], maxFret: 3, accidentals: false },
  rhythm: { rests: true, dotted: false },
  keys: { max: 2 },
};
const DAILY_GOAL = 50;
function clone(o) { return JSON.parse(JSON.stringify(o)); }
/* Each device keeps its own XP counter; totals add them up, so two devices never overwrite each other. */
let DEVICE = 'd' + Math.random().toString(36).slice(2, 11);
try {
  const saved = localStorage.getItem('guitar-note-reading-device');
  if (saved && /^[a-z0-9]{4,24}$/.test(saved)) DEVICE = saved; else localStorage.setItem('guitar-note-reading-device', DEVICE);
} catch (e) { /* storage unavailable */ }

function blankStore() {
  return { v: 2, items: {}, days: [], lessons: {}, rounds: {}, levels: {}, best: {}, xp: {}, settings: clone(DEFAULT_SETTINGS), practice: clone(DEFAULT_PRACTICE), settingsAt: 0, updated: 0, resetAt: 0 };
}
function sanitizeStore(d) {
  const b = blankStore();
  if (!d || typeof d !== 'object') return b;
  const obj = x => x && typeof x === 'object';
  if (obj(d.items)) Object.keys(d.items).forEach(k => {
    const r = d.items[k];
    if (!obj(r) || k.length > 40) return;
    b.items[k] = { n: Math.max(0, +r.n || 0), c: Math.max(0, +r.c || 0), h: String(r.h || '').replace(/[^01]/g, '').slice(-12), t: +r.t || 0 };
  });
  if (Array.isArray(d.days)) b.days = d.days.filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x)).slice(-400);
  if (obj(d.lessons)) Object.keys(d.lessons).forEach(k => { if (d.lessons[k]) b.lessons[k] = +d.lessons[k] || 1; });
  if (obj(d.rounds)) Object.keys(d.rounds).forEach(k => { const r = d.rounds[k]; if (obj(r)) b.rounds[k] = { score: +r.score || 0, total: +r.total || 0, at: +r.at || 0 }; });
  if (obj(d.levels)) Object.keys(d.levels).forEach(k => {
    const r = d.levels[k];
    if (!obj(r) || !/^[a-z]{2,20}$/.test(k)) return;
    b.levels[k] = { s: Math.max(0, Math.min(3, Math.round(+r.s || 0))), p: Math.max(0, Math.min(100, +r.p || 0)), at: +r.at || 0 };
  });
  if (obj(d.best)) Object.keys(d.best).forEach(k => { const r = d.best[k]; if (obj(r) && /^[a-z]{2,12}$/.test(k)) b.best[k] = { score: Math.max(0, +r.score || 0), at: +r.at || 0 }; });
  if (obj(d.xp)) Object.keys(d.xp).forEach(dev => {
    const e = d.xp[dev];
    if (!obj(e) || !/^[a-z0-9]{4,24}$/.test(dev)) return;
    const days = {};
    if (obj(e.d)) Object.keys(e.d).filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k)).sort().slice(-60).forEach(k => { days[k] = Math.max(0, +e.d[k] || 0); });
    b.xp[dev] = { t: Math.max(0, +e.t || 0), d: days, at: +e.at || 0 };
  });
  if (obj(d.settings)) {
    if (['letters', 'solfege', 'both'].indexOf(d.settings.names) >= 0) b.settings.names = d.settings.names;
    if (typeof d.settings.sound === 'boolean') b.settings.sound = d.settings.sound;
    if (typeof d.settings.autoNext === 'boolean') b.settings.autoNext = d.settings.autoNext;
  }
  if (obj(d.practice)) {
    const n = d.practice.notes;
    if (n && Array.isArray(n.strings)) {
      const s = n.strings.filter(x => [1, 2, 3, 4, 5, 6].indexOf(x) >= 0);
      if (s.length) b.practice.notes.strings = s.sort();
      if ([0, 3, 5, 7, 12].indexOf(n.maxFret) >= 0) b.practice.notes.maxFret = n.maxFret;
      b.practice.notes.accidentals = !!n.accidentals;
    }
    const r = d.practice.rhythm;
    if (r) { b.practice.rhythm.rests = !!r.rests; b.practice.rhythm.dotted = !!r.dotted; }
    const k = d.practice.keys;
    if (k && [1, 2, 3, 4].indexOf(k.max) >= 0) b.practice.keys.max = k.max;
  }
  b.settingsAt = +d.settingsAt || 0;
  b.updated = +d.updated || 0;
  b.resetAt = +d.resetAt || 0;
  return b;
}

const Store = (() => {
  let data = blankStore();
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) data = sanitizeStore(JSON.parse(raw)); } catch (e) { /* storage unavailable */ }

  function saveLocal() { try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) { /* storage unavailable */ } }
  function touch() { data.updated = Date.now(); saveLocal(); Cloud.schedule(); }
  function todayStr(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function markDay() {
    const d = todayStr();
    if (data.days[data.days.length - 1] !== d) { data.days.push(d); data.days = data.days.slice(-400); }
  }
  function record(key, ok) {
    const r = data.items[key] || { n: 0, c: 0, h: '', t: 0 };
    r.n += 1; if (ok) r.c += 1;
    r.h = (r.h + (ok ? '1' : '0')).slice(-12);
    r.t = Date.now();
    data.items[key] = r;
    markDay();
    touch();
  }
  function mastery(key) {
    const r = data.items[key];
    if (!r || !r.n) return 'new';
    const h = r.h.slice(-8);
    const acc = h.split('').filter(c => c === '1').length / h.length;
    if (h.length >= 4 && acc >= 0.85) return 'strong';
    if (acc >= 0.6) return 'ok';
    return 'weak';
  }
  function weight(key) {
    const r = data.items[key];
    if (!r || !r.n) return 2.2;
    const h = r.h.slice(-6);
    const acc = h.split('').filter(c => c === '1').length / h.length;
    return 0.5 + (1 - acc) * 3.5 + (h.length < 3 ? 0.9 : 0);
  }
  function dayStreak() {
    const set = new Set(data.days);
    const d = new Date();
    if (!set.has(todayStr(d))) { d.setDate(d.getDate() - 1); if (!set.has(todayStr(d))) return 0; }
    let n = 0;
    while (set.has(todayStr(d))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function totals() {
    let n = 0, c = 0;
    Object.keys(data.items).forEach(k => { n += data.items[k].n; c += data.items[k].c; });
    return { n, c };
  }
  function addXp(n) {
    if (!n) return;
    const e = data.xp[DEVICE] || { t: 0, d: {}, at: 0 };
    const day = todayStr();
    e.t += n;
    e.d[day] = (e.d[day] || 0) + n;
    const keys = Object.keys(e.d).sort();
    if (keys.length > 60) keys.slice(0, keys.length - 60).forEach(k => delete e.d[k]);
    e.at = Date.now();
    data.xp[DEVICE] = e;
    markDay();
    touch();
  }
  function xpTotal() { return Object.keys(data.xp).reduce((a, k) => a + data.xp[k].t, 0); }
  function xpToday() { const day = todayStr(); return Object.keys(data.xp).reduce((a, k) => a + (data.xp[k].d[day] || 0), 0); }
  function merge(remote) {
    const r = sanitizeStore(remote);
    let changed = false;
    if (r.resetAt > (data.resetAt || 0)) {
      /* progress was reset on another device: drop what this device learned before that */
      const cut = r.resetAt, cutDay = todayStr(new Date(cut));
      Object.keys(data.items).forEach(k => { if (data.items[k].t <= cut) delete data.items[k]; });
      Object.keys(data.lessons).forEach(k => { if (data.lessons[k] <= cut) delete data.lessons[k]; });
      Object.keys(data.rounds).forEach(k => { if (data.rounds[k].at <= cut) delete data.rounds[k]; });
      Object.keys(data.levels).forEach(k => { if (data.levels[k].at <= cut) delete data.levels[k]; });
      Object.keys(data.best).forEach(k => { if (data.best[k].at <= cut) delete data.best[k]; });
      Object.keys(data.xp).forEach(k => { if (data.xp[k].at <= cut) delete data.xp[k]; });
      data.days = data.days.filter(x => x >= cutDay);
      data.resetAt = cut;
      changed = true;
    }
    Object.keys(r.items).forEach(k => { const a = data.items[k], b = r.items[k]; if (!a || b.t > a.t) { data.items[k] = b; changed = true; } });
    const days = Array.from(new Set(data.days.concat(r.days))).sort().slice(-400);
    if (days.length !== data.days.length) { data.days = days; changed = true; }
    Object.keys(r.lessons).forEach(k => { if (!data.lessons[k]) { data.lessons[k] = r.lessons[k]; changed = true; } });
    Object.keys(r.rounds).forEach(k => { if (!data.rounds[k] || r.rounds[k].at > data.rounds[k].at) { data.rounds[k] = r.rounds[k]; changed = true; } });
    Object.keys(r.levels).forEach(k => {
      const a = data.levels[k], b = r.levels[k];
      if (!a) { data.levels[k] = b; changed = true; }
      else if (b.s > a.s || b.p > a.p) { data.levels[k] = { s: Math.max(a.s, b.s), p: Math.max(a.p, b.p), at: Math.max(a.at, b.at) }; changed = true; }
    });
    Object.keys(r.best).forEach(k => { const a = data.best[k], b = r.best[k]; if (!a || b.score > a.score) { data.best[k] = b; changed = true; } });
    Object.keys(r.xp).forEach(k => {
      if (k === DEVICE && data.xp[k]) return; /* this device is the only writer of its own counter */
      const a = data.xp[k], b = r.xp[k];
      if (!a || b.t > a.t || (b.t === a.t && b.at > a.at)) { data.xp[k] = b; changed = true; }
    });
    if (r.settingsAt > data.settingsAt) { data.settings = r.settings; data.practice = r.practice; data.settingsAt = r.settingsAt; changed = true; }
    if (changed) saveLocal();
    return changed;
  }
  return {
    get data() { return data; },
    get settings() { return data.settings; },
    record, mastery, weight, dayStreak, totals, merge, todayStr, addXp, xpTotal, xpToday,
    setSetting(k, v) { data.settings[k] = v; data.settingsAt = Date.now(); touch(); },
    setPractice(group, cfg) { data.practice[group] = clone(cfg); data.settingsAt = Date.now(); touch(); },
    markLesson(id, done) { if (done) data.lessons[id] = Date.now(); else delete data.lessons[id]; touch(); },
    saveRound(mode, score, total) { data.rounds[mode] = { score, total, at: Date.now() }; touch(); },
    saveLevel(id, stars, pct) {
      const o = data.levels[id] || { s: 0, p: 0, at: 0 };
      const better = stars > o.s;
      data.levels[id] = { s: Math.max(o.s, stars), p: Math.max(o.p, pct), at: Date.now() };
      touch();
      return better;
    },
    levelStars(id) { return data.levels[id] ? data.levels[id].s : 0; },
    saveBest(mode, score) {
      const o = data.best[mode];
      const isBest = !o || score > o.score;
      if (isBest) data.best[mode] = { score, at: Date.now() };
      touch();
      return isBest;
    },
    best(mode) { return data.best[mode] ? data.best[mode].score : 0; },
    reset() {
      const keep = { settings: data.settings, practice: data.practice, settingsAt: data.settingsAt };
      data = blankStore();
      Object.assign(data, keep);
      data.resetAt = Date.now();
      touch();
      Cloud.writeNow(true);
    },
  };
})();

/* Account sync through the page's private per-person document. */
const Cloud = (() => {
  let ref = null, writing = false, pending = false, timer = null, disabled = false, lastSent = '';
  const state = { mode: 'local' };
  function body() {
    const d = Store.data;
    return { v: 2, items: d.items, days: d.days, lessons: d.lessons, rounds: d.rounds, levels: d.levels, best: d.best, xp: d.xp, settings: d.settings, practice: d.practice, settingsAt: d.settingsAt, updated: d.updated, resetAt: d.resetAt || 0 };
  }
  async function write(force) {
    if (!ref || disabled) return;
    if (writing) { pending = true; return; }
    const b = body();
    const s = JSON.stringify(b);
    if (s === lastSent && !force) return;
    writing = true;
    try {
      await ref.set(b);
      lastSent = s;
    } catch (e) {
      if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted' || e.code === 'capability_disabled' || e.code === 'quota_exceeded')) { disabled = true; state.mode = 'local'; }
      else if (e && e.code === 'unavailable') { setTimeout(() => write(), 1500 + Math.random() * 1500); }
    }
    writing = false;
    if (pending) { pending = false; schedule(800); }
  }
  function schedule(delay) {
    if (!ref || disabled) return;
    clearTimeout(timer);
    timer = setTimeout(() => write(), delay || 2500);
  }
  async function init(onChange) {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const both = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const db = both[0], user = both[1];
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      ref = db.doc('data/users/' + id + '/progress');
      const snap = await new Promise((resolve, reject) => {
        const t = setTimeout(() => reject({ code: 'timeout' }), 10000);
        ref.get().then(v => { clearTimeout(t); resolve(v); }, e => { clearTimeout(t); reject(e); });
      });
      state.mode = 'account';
      if (snap && snap.exists) {
        const remote = snap.data();
        lastSent = JSON.stringify(remote);
        Store.merge(remote);
        if (JSON.stringify(body()) !== lastSent) schedule(1200);
      } else if (Store.data.updated) {
        schedule(1200);
      }
      if (onChange) onChange();
    } catch (e) {
      if (!e || e.code !== 'timeout') ref = null;
      state.mode = ref ? 'account' : 'local';
      if (onChange) onChange();
    }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') write(); });
  return { init, schedule, writeNow: write, state };
})();

/* ---------- Figure helpers ---------- */
function figStaffSp() { return isPhone() ? 9 : 11; }
function midiAtP(p, a) { return midiOf(pitchAt(p, a || 0)); }

const FIGS = {
  alphabet(el) {
    const seq = [{ l: 5, f: 0 }, { l: 6, f: 2 }, { l: 0, f: 3 }, { l: 1, f: 5 }, { l: 2, f: 7 }, { l: 3, f: 8 }, { l: 4, f: 10 }, { l: 5, f: 12 }];
    let on = null;
    el.innerHTML = '<div class="steps" role="group" aria-label="Notes on the 5th string"></div><div class="fb-wrap" data-board></div><p class="fig-cap">Your 5th string from open A to the 12th fret. The numbers between letters count frets; red marks the two half steps. Tap a letter or a dot to hear it.</p>';
    const strip = $('.steps', el), board = $('[data-board]', el);
    function draw() {
      strip.innerHTML = seq.map((x, i) => {
        const gapTxt = i < seq.length - 1 ? String(seq[i + 1].f - x.f) : '';
        const half = i < seq.length - 1 && seq[i + 1].f - x.f === 1;
        return '<button class="step-note' + (on === x.f ? ' on' : '') + '" data-f="' + x.f + '">' + letterName(x.l, NS() === 'both' ? 'letters' : NS()) + '</button>' +
          (gapTxt ? '<span class="step-gap' + (half ? ' half' : '') + '"><i></i><em>' + gapTxt + '</em></span>' : '');
      }).join('');
      const dots = [];
      for (let f = 0; f <= 12; f++) {
        const sp = spellings(posMidi(5, f));
        if (sp.length === 1) dots.push({ s: 5, f, text: noteName(sp[0], NS() === 'both' ? 'letters' : NS()), cls: on === f ? 'mk-good' : 'mk-accent' });
        else dots.push({ s: 5, f, r: 5, cls: 'mk-dot' + (on === f ? ' on' : '') });
      }
      mountFretboard(board, { maxFret: 12, dots, activeStrings: [5], interactive: true, names: NS(), aria: 'Fretboard with the notes of the 5th string' });
    }
    function pick(f, s) { on = s && s !== 5 ? null : f; Sound.note(posMidi(s || 5, f)); draw(); }
    strip.addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) pick(+b.dataset.f, 5); });
    board.addEventListener('click', e => { const h = e.target.closest('.hit'); if (h) pick(+h.dataset.f, +h.dataset.s); });
    draw(); addResizer(draw);

  staff(el) {
    let mode = 'lines', on = null;
    el.innerHTML = '<div class="seg small" role="group" aria-label="Show"><button data-m="lines">Lines</button><button data-m="spaces">Spaces</button><button data-m="all">Both</button></div><div class="fig-staff" data-staff></div><p class="fig-cap" data-cap></p>';
    const host = $('[data-staff]', el), cap = $('[data-cap]', el);
    function ps() { return mode === 'lines' ? [0, 2, 4, 6, 8] : mode === 'spaces' ? [1, 3, 5, 7] : [0, 1, 2, 3, 4, 5, 6, 7, 8]; }
    function draw() {
      $$('[data-m]', el).forEach(b => b.setAttribute('aria-pressed', b.dataset.m === mode));
      const items = ps().map(p => ({ kind: 'note', p, dur: 'w', label: noteName(pitchAt(p), NS() === 'both' ? 'letters' : NS()), hit: true, cls: on === p ? 'on' : (p === 2 ? 'g-line' : '') }));
      mountStaff(host, { clef: 'g8', items, gap: mode === 'all' ? 2.7 : 3.4, padR: 1, aria: 'Notes on the ' + mode }, figStaffSp() * 1.15);
      cap.innerHTML = mode === 'lines' ? 'Lines from bottom to top: <b>E G B D F</b>, Every Good Boy Does Fine.' : mode === 'spaces' ? 'Spaces from bottom to top spell <b>F A C E</b>.' : 'Line, space, line, space: each step is the next letter. Tap a note to hear it.';
    }
    el.addEventListener('click', e => {
      const m = e.target.closest('[data-m]');
      if (m) { mode = m.dataset.m; on = null; draw(); return; }
      const n = e.target.closest('.nt[data-i]');
      if (n) { const p = ps()[+n.dataset.i]; on = p; Sound.note(midiAtP(p)); draw(); }

  },

  open(el) {
    const strs = [6, 5, 4, 3, 2, 1];
    let on = null;
    el.innerHTML = '<div class="fig-staff" data-staff></div><div class="fb-wrap" data-board></div><div class="fig-actions"><button class="btn" data-strum>' + ICONS.play + 'Play all six strings</button></div>';
    const host = $('[data-staff]', el), board = $('[data-board]', el);
    function draw() {
      const items = strs.map(s => {
        const p = spellings(OPEN_WRITTEN[s])[0];
        return { kind: 'note', p: staffPos(p), dur: 'w', hit: true, label: nm(p) + '\n' + ordinal(s), cls: on === s ? 'on' : '' };
      });
      mountStaff(host, { clef: 'g8', items, gap: 3.3, padR: 1, aria: 'The six open strings on the staff' }, figStaffSp() * 1.1);

    el.addEventListener('click', e => {
      if (e.target.closest('[data-strum]')) {
        on = null; draw();
        Sound.strum(strs.map(s => OPEN_WRITTEN[s]), 0.26);
        strs.forEach((s, i) => setTimeout(() => { on = s; draw(); }, 40 + i * 260));
        setTimeout(() => { on = null; draw(); }, 40 + 6 * 260 + 600);
        return;
      }
      const n = e.target.closest('.nt[data-i]');
      if (n) { pick(strs[+n.dataset.i]); return; }
      const h = e.target.closest('.hit');
      if (h) { const s = +h.dataset.s, f = +h.dataset.f; if (f === 0) pick(s); else { on = null; Sound.note(posMidi(s, f)); draw(); } }
    });
    draw(); addResizer(draw);
  },

  ledger(el) {
    const notes = [{ id: 'E3', s: 6, f: 0 }, { id: 'F3', s: 6, f: 1 }, { id: 'G3', s: 6, f: 3 }, { id: 'A3', s: 5, f: 0 }, { id: 'B3', s: 5, f: 2 }, { id: 'C4', s: 5, f: 3 }, { id: 'D4', s: 4, f: 0 }];
    let on = null;
    el.innerHTML = '<div class="fig-staff" data-staff></div><div class="fb-wrap" data-board></div><p class="fig-cap">The notes of your two lowest strings, plus open D. Tap a note on the staff or the fretboard.</p>';
    const host = $('[data-staff]', el), board = $('[data-board]', el);
    function draw() {
      const items = notes.map((n, i) => ({ kind: 'note', p: staffPos(parsePitch(n.id)), dur: 'w', hit: true, label: nm(parsePitch(n.id)), cls: on === i ? 'on' : '' }));
      mountStaff(host, { clef: 'g8', items, gap: 3.0, padR: 1, aria: 'Low notes on ledger lines' }, figStaffSp() * 1.1);
      const dots = notes.map((n, i) => ({ s: n.s, f: n.f, text: nm(parsePitch(n.id)), cls: on === i ? 'mk-good' : 'mk-accent' }));
      mountFretboard(board, { maxFret: 4, dots, interactive: true, names: NS(), showZero: true, activeStrings: [4, 5, 6], maxFw: 64 });
    }
    function pick(i) { on = i; Sound.note(midiOf(parsePitch(notes[i].id))); draw(); }
    el.addEventListener('click', e => {
      const n = e.target.closest('.nt[data-i]');
      if (n) { pick(+n.dataset.i); return; }
      const h = e.target.closest('.hit');
      if (h) {
        const s = +h.dataset.s, f = +h.dataset.f;
        const i = notes.findIndex(x => x.s === s && x.f === f);
        if (i >= 0) pick(i); else { on = null; Sound.note(posMidi(s, f)); draw(); }
      }
    });
    draw(); addResizer(draw);
  },

  accidentals(el) {
    const seq = [
      { id: 'F#4', acc: 1, dur: 'q', s: 4, f: 4 }, { id: 'F#4', dur: 'q', s: 4, f: 4 }, { id: 'F4', acc: 0, dur: 'q', s: 4, f: 3 }, { id: 'G4', dur: 'q', s: 4, f: 5 },
      { bar: true },
      { id: 'Gb4', acc: -1, dur: 'h', s: 4, f: 4 }, { id: 'G4', acc: 0, dur: 'h', s: 4, f: 5 },
    ];
    let on = null, stop = null;
    el.innerHTML = '<div class="fig-staff" data-staff></div><div class="fb-wrap" data-board></div><div class="fig-actions"><button class="btn" data-play>' + ICONS.play + 'Play both measures</button></div><p class="fig-cap">The second note has no sign but is still F♯, because it is in the same measure. The natural sign brings back plain F.</p>';
    const host = $('[data-staff]', el), board = $('[data-board]', el);
    function draw() {
      const items = seq.map((x, i) => x.bar ? { kind: 'bar' } : { kind: 'note', p: staffPos(parsePitch(x.id)), acc: x.acc, dur: x.dur, hit: true, label: nm(parsePitch(x.id)), cls: on === i ? 'on' : '' });
      mountStaff(host, { clef: 'g8', time: [4, 4], items, beatW: 2.6, padR: 0.2, endBar: 'final', aria: 'Two measures with sharps, flats and naturals' }, figStaffSp() * 1.15);
      const cur = on !== null ? seq[on] : null;
      const dots = [3, 4, 5].map(f => {
        const sp = spellings(posMidi(4, f));
        const txt = sp.length === 1 ? nm(sp[0]) : nm(sp[0]) + '/' + nm(sp[1]);
        return { s: 4, f, text: txt, cls: cur && cur.f === f ? 'mk-good' : 'mk-accent' };
      });
      mountFretboard(board, { maxFret: 5, dots, interactive: true, names: NS(), activeStrings: [4], maxFw: 72 });
    }
    function pick(i) { on = i; Sound.note(midiOf(parsePitch(seq[i].id))); draw(); }
    el.addEventListener('click', e => {
      if (e.target.closest('[data-play]')) {
        if (stop) stop();
        const ev = seq.map((x, i) => x.bar ? null : { beats: durBeats(x.dur), midi: midiOf(parsePitch(x.id)), i }).filter(Boolean);
        stop = Sound.rhythm(ev, { bpm: 92, onStep: k => { on = ev[k].i; draw(); }, onEnd: () => { on = null; stop = null; draw(); } });
        return;
      }
      const n = e.target.closest('.nt[data-i]');
      if (n) { pick(+n.dataset.i); return; }
      const h = e.target.closest('.hit');
      if (h) { on = null; Sound.note(posMidi(+h.dataset.s, +h.dataset.f)); draw(); }
    });
    draw(); addResizer(draw);
    return () => { if (stop) stop(); };
  },

  lengths(el) {
    const rows = [
      { dur: 'w', n: 1, name: 'Whole note', beats: '4 beats', counts: ['1\u00A0\u00A02\u00A0\u00A03\u00A0\u00A04'] },
      { dur: 'h', n: 2, name: 'Half notes', beats: '2 beats each', counts: ['1\u00A0\u00A02', '3\u00A0\u00A04'] },
      { dur: 'q', n: 4, name: 'Quarter notes', beats: '1 beat each', counts: ['1', '2', '3', '4'] },
      { dur: 'e', n: 8, name: 'Eighth notes', beats: '½ beat each', counts: ['1', '&', '2', '&', '3', '&', '4', '&'] },
      { dur: 's', n: 16, name: 'Sixteenth notes', beats: '¼ beat each', counts: '1 e & a 2 e & a 3 e & a 4 e & a'.split(' ') },
    ];
    let playing = null, step = -1, stop = null;
    el.innerHTML = rows.map((r, i) => '<div class="len-row" data-row="' + i + '"><div class="len-head"><b>' + r.name + '</b><span>' + r.beats + '</span><button class="btn small" data-play="' + i + '" aria-label="Play ' + r.name + '">' + ICONS.play + 'Play</button></div><div class="fig-staff tight" data-staff="' + i + '"></div></div>').join('') +
      '<p class="fig-cap">All rows last the same time: one measure of 4/4. Beats here are quarter-note beats.</p>';
    function drawRow(i) {
      const r = rows[i], host = $('[data-staff="' + i + '"]', el);
      const avail = (host.clientWidth || 320) / (figStaffSp() * 0.9);
      const beatW = Math.max(2.4, (avail - 2.2) / 4);
      const items = [];
      for (let k = 0; k < r.n; k++) {
        const beam = r.dur === 'e' ? Math.floor(k / 2) : r.dur === 's' ? Math.floor(k / 4) : undefined;
        items.push({ kind: 'note', p: 3, dur: r.dur, beam, label: r.counts[k] || '', labelAlign: r.n <= 2 ? 'start' : '', cls: playing === i && step === k ? 'on' : '' });
      }
      mountStaff(host, { items, beatW, padR: 0.3, endBar: 'single', aria: r.name }, figStaffSp() * 0.9, { shrink: true });
    }
    function draw() { rows.forEach((r, i) => drawRow(i)); }
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-play]');
      if (!b) return;
      const i = +b.dataset.play, r = rows[i];
      if (stop) stop();
      playing = i; step = -1;
      const ev = [];
      for (let k = 0; k < r.n; k++) ev.push({ beats: DURATIONS[r.dur].beats, midi: 69 });
      stop = Sound.rhythm(ev, { bpm: 72, countIn: true, onStep: k => { step = k; drawRow(i); }, onEnd: () => { playing = null; step = -1; stop = null; drawRow(i); } });
    });
    draw(); addResizer(draw);
    return () => { if (stop) stop(); };
  },

  rests(el) {
    const rs = ['w', 'h', 'q', 'e', 's'];
    el.innerHTML = '<div class="fig-staff" data-staff></div>';
    const host = $('[data-staff]', el);
    function draw() {
      const items = rs.map(d => ({ kind: 'rest', dur: d, label: DURATIONS[d].name + '\n' + beatsWords(DURATIONS[d].beats) }));
      mountStaff(host, { items, gap: 5.2, padR: 0.6, aria: 'Rests from whole to sixteenth' }, figStaffSp() * 1.1);
    }
    draw(); addResizer(draw);
  },

  restbar(el) {
    const seq = [{ dur: 'q' }, { dur: 'q', rest: 1 }, { dur: 'q' }, { dur: 'q', rest: 1 }, { bar: 1 }, { dur: 'h' }, { dur: 'h', rest: 1 }];
    const counts = ['1', '(2)', '3', '(4)', '', '1\u00A0\u00A02', '(3\u00A0\u00A04)'];
    let on = null, stop = null;
    el.innerHTML = '<div class="fig-staff" data-staff></div><div class="fig-actions"><button class="btn" data-play>' + ICONS.play + 'Play with a count-in</button></div><p class="fig-cap">Counts in brackets are silent beats.</p>';
    const host = $('[data-staff]', el);
    function draw() {
      const items = seq.map((x, i) => x.bar ? { kind: 'bar' } : { kind: x.rest ? 'rest' : 'note', p: 3, dur: x.dur, label: counts[i], labelAlign: x.dur === 'h' ? 'start' : '', cls: on === i ? 'on' : '' });
      mountStaff(host, { clef: 'g8', time: [4, 4], items, beatW: 3.2, padR: 0.2, endBar: 'final', aria: 'Two measures with rests' }, figStaffSp() * 1.05);
    }
    el.addEventListener('click', e => {
      if (!e.target.closest('[data-play]')) return;
      if (stop) stop();
      const ev = seq.map((x, i) => x.bar ? null : { beats: durBeats(x.dur), rest: !!x.rest, midi: 69, i }).filter(Boolean);
      stop = Sound.rhythm(ev, { bpm: 84, countIn: true, onStep: k => { on = ev[k].i; draw(); }, onEnd: () => { on = null; stop = null; draw(); } });
    });

    return () => { if (stop) stop(); };
  },

  tie(el) {
    const seq = [{ dur: 'h', tie: true }, { dur: 'q' }, { dur: 'q', rest: 1 }, { bar: 1 }, { dur: 'h', dots: 1 }, { dur: 'q', rest: 1 }];
    const counts = ['1\u00A0\u00A02', '3', '(4)', '', '1\u00A0\u00A02\u00A0\u00A03', '(4)'];
    let on = null, stop = null;
    el.innerHTML = '<div class="fig-staff" data-staff></div><div class="fig-actions"><button class="btn" data-play>' + ICONS.play + 'Play: both last 3 beats</button></div>';
    const host = $('[data-staff]', el);
    function draw() {
      const items = seq.map((x, i) => x.bar ? { kind: 'bar' } : { kind: x.rest ? 'rest' : 'note', p: 3, dur: x.dur, dots: x.dots, tie: x.tie, label: counts[i], labelAlign: x.dur === 'h' ? 'start' : '', cls: on === i ? 'on' : '' });
      mountStaff(host, { clef: 'g8', time: [4, 4], items, beatW: 3.0, padR: 0.2, endBar: 'final', aria: 'A tied half and quarter note, then a dotted half note' }, figStaffSp() * 1.05);

    el.addEventListener('click', e => {
      if (!e.target.closest('[data-play]')) return;

      stop = Sound.rhythm(ev, { bpm: 84, countIn: true, onStep: k => { on = ev[k].i; draw(); }, onEnd: () => { on = null; stop = null; draw(); } });

  meters(el) {
    const ms = [
      { time: [4, 4], items: ['q', 'q', 'q', 'q'], counts: ['1', '2', '3', '4'], perBar: 4, unit: 1, bpm: 88, label: '4/4: four beats' },
      { time: [3, 4], items: ['q', 'q', 'q'], counts: ['1', '2', '3'], perBar: 3, unit: 1, bpm: 88, label: '3/4: three beats' },
      { time: [6, 8], items: ['e', 'e', 'e', 'e', 'e', 'e'], counts: ['1', '2', '3', '4', '5', '6'], perBar: 6, unit: 0.5, bpm: 66, label: '6/8: six eighth notes in two groups' },
    ];
    let playing = null, step = -1, stop = null;
    el.innerHTML = '<div class="meters">' + ms.map((m, i) => '<div class="meter"><div class="len-head"><b>' + m.label + '</b><button class="btn small" data-play="' + i + '" aria-label="Play ' + m.label + '">' + ICONS.play + 'Play</button></div><div class="fig-staff tight" data-staff="' + i + '"></div></div>').join('') + '</div>';
    function drawOne(i) {
      const m = ms[i];
      const items = m.items.map((d, k) => ({ kind: 'note', p: 3, dur: d, beam: d === 'e' ? Math.floor(k / 3) : undefined, label: m.counts[k], cls: playing === i && step === k ? 'on' : '' }));
      mountStaff($('[data-staff="' + i + '"]', el), { clef: 'g8', time: m.time, items, beatW: m.unit === 1 ? 2.8 : 4.4, padR: 0.2, endBar: 'single', aria: m.label }, figStaffSp());
    }
    function draw() { ms.forEach((m, i) => drawOne(i)); }
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-play]');
      if (!b) return;
      const i = +b.dataset.play, m = ms[i];
      if (stop) stop();
      playing = i; step = -1;
      const ev = m.items.concat(m.items).map(d => ({ beats: DURATIONS[d].beats, midi: 69 }));
      stop = Sound.rhythm(ev, { bpm: m.bpm, countIn: true, clickUnit: m.unit, beatsPerBar: m.perBar, onStep: k => { step = k % m.items.length; drawOne(i); }, onEnd: () => { playing = null; step = -1; stop = null; drawOne(i); } });
    });
    draw(); addResizer(draw);

  keysig(el) {
    let key = 'G', on = null, stop = null;
    el.innerHTML = '<div class="seg small wrap" role="group" aria-label="Key" data-keys></div><div class="fig-staff" data-staff></div><p class="fig-cap" data-cap></p><div class="fig-actions"><button class="btn" data-play>' + ICONS.play + 'Play the scale</button></div>';
    const host = $('[data-staff]', el), cap = $('[data-cap]', el), keys = $('[data-keys]', el);
    function draw() {
      keys.innerHTML = KEYS.map(k => '<button data-k="' + k.id + '" aria-pressed="' + (k.id === key) + '">' + noteName({ l: k.tonic.l, a: k.tonic.a, o: 4 }, NS() === 'both' ? 'letters' : NS()) + '</button>').join('');
      const k = keyById(key);
      const sc = keyScale(k);
      const items = sc.map((p, i) => ({ kind: 'note', p: staffPos(p), dur: 'q', label: nm(p), labelCls: p.a ? 'hl' : '', cls: on === i ? 'on' : '' }));
      mountStaff(host, { clef: 'g8', key: k.n, items, gap: 2.6, padR: 0.2, endBar: 'final', aria: keyName(k, NS()) + ' scale' }, figStaffSp() * 1.1);
      const sig = keySigLetters(k.n).map(x => noteName({ l: x.l, a: x.a, o: 4 }, NS() === 'both' ? 'letters' : NS()));
      cap.innerHTML = '<b>' + keyName(k, NS()) + '</b>: ' + (k.n === 0 ? 'no sharps or flats.' : Math.abs(k.n) + (k.n > 0 ? (k.n === 1 ? ' sharp' : ' sharps') : (k.n === -1 ? ' flat' : ' flats')) + ' (' + sig.join(', ') + '). ' + (k.n > 0 ? 'Every ' : 'Every ') + sig.map(s => s.slice(0, -1)).join(', every ') + ' is played ' + (k.n > 0 ? 'sharp.' : 'flat.'));
    }
    el.addEventListener('click', e => {
      const kb = e.target.closest('[data-k]');
      if (kb) { if (stop) stop(); key = kb.dataset.k; on = null; draw(); return; }
      if (e.target.closest('[data-play]')) {
        if (stop) stop();
        const sc = keyScale(keyById(key));
        const ev = sc.map(p => ({ beats: 1, midi: midiOf(p) }));
        ev[7].beats = 2;
        stop = Sound.rhythm(ev, { bpm: 132, clicks: false, onStep: k => { on = k; draw(); }, onEnd: () => { on = null; stop = null; draw(); } });
      }
    });
    draw(); addResizer(draw);
    return () => { if (stop) stop(); };
  },

  neck(el) {
    let sel = { s: 1, f: 0 };
    el.innerHTML = '<div class="neck-top"><div class="fig-staff small" data-staff></div><p class="fig-cap" data-cap></p></div><div class="fb-wrap" data-board></div>';
    const host = $('[data-staff]', el), cap = $('[data-cap]', el), board = $('[data-board]', el);
    function draw() {
      const midi = posMidi(sel.s, sel.f);
      const sp = spellings(midi);
      const p = sp[0];
      const same = positionsOf(midi, 12);
      const dots = [];
      for (let s = 1; s <= 6; s++) for (let f = 0; f <= 12; f++) {
        const m = posMidi(s, f);
        if (m === midi) dots.push({ s, f, text: nm(spellings(m)[0]), cls: s === sel.s && f === sel.f ? 'mk-good' : 'mk-accent' });
        else if ((m - midi) % 12 === 0) dots.push({ s, f, text: nm(spellings(m)[0]), cls: 'mk-soft' });
      }
      mountFretboard(board, { maxFret: 12, dots, interactive: true, names: NS(), showZero: true });
      const items = [{ kind: 'note', p: staffPos(p), acc: p.a ? p.a : undefined, dur: 'w', cls: 'on' }];
      mountStaff(host, { clef: 'g8', items, center: true, width: 11, padR: 0.6, yRange: [-3.6, 8.2], aria: 'The selected note on the staff' }, isPhone() ? 9 : 10, { shrink: true });
      cap.innerHTML = '<b>' + nm(p) + '</b> (' + staffPlace(staffPos(p)).toLowerCase() + ') can be played in <b>' + same.length + ' ' + (same.length === 1 ? 'place' : 'places') + '</b> up to the 12th fret: ' + same.map(x => posLabel(x.s, x.f)).join('; ') + '. Lighter dots are the same letter in other octaves. Tap any spot.';
    }
    board.addEventListener('click', e => { const h = e.target.closest('.hit'); if (h) { sel = { s: +h.dataset.s, f: +h.dataset.f }; Sound.note(posMidi(sel.s, sel.f)); draw(); } });
    draw(); addResizer(draw);
  },

  signs(el) {
    const ph = [
      { id: 'E5', s: 2, f: 5, fing: '1', rh: 'i', mark: 'V' },
      { id: 'F5', s: 2, f: 6, fing: '2', rh: 'm' },
      { id: 'G5', s: 2, f: 8, fing: '4', rh: 'i' },
      { id: 'A5', s: 1, f: 5, fing: '1', rh: 'm' },
    ];
    let on = null, stop = null;
    el.innerHTML = '<div class="fig-staff" data-staff></div><div class="fig-staff tab" data-tab></div><div class="fig-actions"><button class="btn" data-play>' + ICONS.play + 'Play the phrase</button></div><p class="fig-cap">Above the notes: left-hand fingers and the position V. Circles: strings. Letters: right-hand fingers. Below: the same phrase in tab.</p>';
    const host = $('[data-staff]', el), tabHost = $('[data-tab]', el);
    function draw() {
      const items = ph.map((x, i) => ({ kind: 'note', p: staffPos(parsePitch(x.id)), dur: 'q', above: x.fing, circle: String(x.s), label: x.rh, labelCls: 'rh', mark: x.mark, cls: on === i ? 'on' : '' }));
      const sp = figStaffSp() * 1.15;
      const m = mountStaff(host, { clef: 'g8', time: [4, 4], items, beatW: 3.4, padR: 0.2, endBar: 'final', aria: 'A guitar phrase with fingering signs' }, sp);
      const t = tabSVG(m.r.W, m.r.noteGeo.map((g, i) => ({ x: g.x + g.w / 2, s: ph[i].s, f: ph[i].f, on: on === i })));
      tabHost.innerHTML = t.svg;
      const tsvg = tabHost.firstChild;
      tsvg.setAttribute('width', Math.round(t.W * m.scale));
      tsvg.setAttribute('height', Math.round(t.H * m.scale));
    }
    el.addEventListener('click', e => {
      if (!e.target.closest('[data-play]')) return;
      if (stop) stop();
      const ev = ph.map(x => ({ beats: 1, midi: posMidi(x.s, x.f) }));
      stop = Sound.rhythm(ev, { bpm: 80, countIn: true, onStep: k => { on = k; draw(); }, onEnd: () => { on = null; stop = null; draw(); } });
    });
    draw(); addResizer(draw);
    return () => { if (stop) stop(); };
  },
};

/* Tab staff aligned with a notation staff of width W. */
function tabSVG(W, notes) {
  const G = 1.5, top = 0.9;
  const ly = s => top + (s - 1) * G;
  const p = [];
  for (let s = 1; s <= 6; s++) p.push('<rect class="sl" x="0" y="' + n3(ly(s) - 0.065) + '" width="' + n3(W) + '" height="0.13"/>');
  p.push('<rect class="bar" x="0" y="' + ly(1) + '" width="0.16" height="' + (5 * G) + '"/>');
  p.push('<rect class="bar" x="' + n3(W - 0.85) + '" y="' + ly(1) + '" width="0.16" height="' + (5 * G) + '"/><rect class="bar" x="' + n3(W - 0.5) + '" y="' + ly(1) + '" width="0.5" height="' + (5 * G) + '"/>');
  ['T', 'A', 'B'].forEach((ch, i) => p.push('<text class="tab-lbl" x="1.6" y="' + n3(ly(2) + i * 2.05 + 0.15) + '" text-anchor="middle">' + ch + '</text>'));
  notes.forEach(n => {
    const y = ly(n.s);
    const t = String(n.f);
    const w = 0.9 + 0.75 * t.length;
    p.push('<g class="tab-n' + (n.on ? ' on' : '') + '"><rect x="' + n3(n.x - w / 2) + '" y="' + n3(y - 0.8) + '" width="' + n3(w) + '" height="1.6" class="tab-bg"/><text x="' + n3(n.x) + '" y="' + n3(y + 0.55) + '" text-anchor="middle">' + t + '</text></g>');
  });
  const H = ly(6) + 1.2;
  return { svg: '<svg class="staff tabst" viewBox="0 0 ' + n3(W) + ' ' + n3(H) + '" role="img" aria-label="Tablature">' + p.join('') + '</svg>', W, H };
}

function staffPlace(p) {
  const ord = ['first', 'second', 'third', 'fourth', 'fifth'];
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  if (p >= 0 && p <= 8) return p % 2 === 0 ? cap(ord[p / 2]) + ' line' : cap(ord[(p - 1) / 2]) + ' space';
  if (p === -1) return 'Just below the staff';
  if (p === 9) return 'Just above the staff';
  if (p < -1) return p % 2 === 0 ? cap(ord[-p / 2 - 1]) + ' ledger line below the staff' : 'Under the ' + ord[(-p - 1) / 2 - 1] + ' ledger line below the staff';
  return p % 2 === 0 ? cap(ord[(p - 8) / 2 - 1]) + ' ledger line above the staff' : 'Over the ' + ord[(p - 9) / 2 - 1] + ' ledger line above the staff';
}

/* ============================================================
   Quiz levels. Each level teaches a little, then asks.
   Every card shows notation: notes on the staff, spots on the

  const wrong = sample(pool.filter(x => durBeats(x.dur, x.dots) !== needB), 3);

  const haveB = tpl.have.reduce((a, x) => a + durBeats(x.dur, x.dots), 0);
  const name = rhythmName({ dur: need.dur, dots: need.dots, rest: need.rest });

    t: 'mc', layout: 'symbols', kicker: 'Complete the measure', prompt: 'Which ' + (need.rest ? 'rest' : 'note') + ' completes this 4/4 measure?', fixed: true,
    options: opts.map(x => ({ sym: x, symName: capFirst(rhythmName(x)).replace(/ (note|rest)$/, ''), correct: x === need })),
    visual: staffVis(st => {
      const items = tpl.have.map(x => ({ kind: x.rest ? 'rest' : 'note', p: 3, dur: x.dur, dots: x.dots, beam: x.beam }));

}

/* ---------- Practice generators ---------- */
function practicePool(mode, cfg) {
  if (mode === 'read' || mode === 'find') return notePool(cfg);
  if (mode === 'fret') return positionPool(cfg);
  if (mode === 'rhythm') return rhythmPool(cfg);
  return KEYS.filter(k => Math.abs(k.n) <= cfg.max);
}
function practiceGen(mode, cfg) {
  const pool = practicePool(mode, cfg);
  const yr = (mode === 'read' || mode === 'find') ? poolYRange(pool) : null;
  const vals = mode === 'rhythm' ? Array.from(new Set(pool.map(it => durBeats(it.dur, it.dots)))).sort((a, b) => b - a) : null;
  const dispMax = Math.max(cfg.maxFret || 0, 4);
  let last = null;
  return () => {
    const it = weightedPick(pool, x => itemKey(mode, x), last);
    last = itemKey(mode, it);
    if (mode === 'read') return qReadNote(it, { yRange: yr, maxFret: dispMax });
    if (mode === 'find') return qFindNote(it, { yRange: yr, maxFret: dispMax });
    if (mode === 'fret') return qNameFret(it.s, it.f, { chromatic: cfg.accidentals, full: true, maxFret: dispMax, strings: cfg.strings });
    if (mode === 'rhythm') return qRhythm(it, { values: vals, full: true });
    return qKey(it, { pool, full: true });
  };
}

  for (let i = 0; i < 150; i++) parts.push({ x: W / 2 + (Math.random() - 0.5) * W * 0.35, y: H * 0.3, vx: (Math.random() - 0.5) * 11, vy: -Math.random() * 11 - 4, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.35, w: 6 + Math.random() * 7, h: 3 + Math.random() * 4, c: colors[i % colors.length] });
  const t0 = performance.now();
  (function frame(t) {
    const el = t - t0;
    ctx.clearRect(0, 0, W, H);
    parts.forEach(p => {
      p.vy += 0.3; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, 1 - el / 2800);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (el < 2800 && canvas.isConnected) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
  })(t0);
}

/* ---------- Shared wording ---------- */
function placePhrase(p) {
  const ord = ['first', 'second', 'third', 'fourth', 'fifth'];
  if (p >= 0 && p <= 8) return p % 2 === 0 ? 'on the ' + ord[p / 2] + ' line' : 'in the ' + ord[(p - 1) / 2] + ' space';
  if (p === -1) return 'just below the staff';
  if (p === 9) return 'just above the staff';
  if (p < -1) return p % 2 === 0 ? 'on the ' + ord[-p / 2 - 1] + ' ledger line below the staff' : 'under the ' + ord[(-p - 1) / 2 - 1] + ' ledger line below the staff';
  return p % 2 === 0 ? 'on the ' + ord[(p - 8) / 2 - 1] + ' ledger line above the staff' : 'over the ' + ord[(p - 9) / 2 - 1] + ' ledger line above the staff';
}
function readTip(p) {
  if (p >= 0 && p <= 8) return p % 2 === 0 ? 'The lines from the bottom are E, G, B, D, F.' : 'The spaces from the bottom spell F, A, C, E.';
  if (p < 0) return 'Count down from the staff: D just below it, C on the first ledger line, B, A on the second, G, F on the third, E below it.';
  return 'Count up from the staff: G just above it, A on the first ledger line, B, C on the second, D, E on the third.';
}
function countHint(s, f) {
  const start = f >= 12 ? 12 : f >= 7 ? 7 : f >= 5 ? 5 : 0;
  const chain = [];
  for (let k = start; k <= f; k++) chain.push(nmShort(spellings(posMidi(s, k))[0]));
  return 'Count up from ' + (start === 0 ? 'the open string' : 'the ' + ordinal(start) + ' fret') + ': ' + chain.join(' → ') + '.';
}
function listPositions(ps) { return ps.map(x => posLabel(x.s, x.f)).join('; '); }

/* ---------- Shell ---------- */
const ROUTES = ['play', 'practice', 'explore', 'progress'];
function parseHash() {
  const h = (location.hash || '').replace(/^#/, '');
  if (ROUTES.indexOf(h) >= 0) return h;
  if (h === 'learn') return 'play';
  if (/^lesson-[a-z]+$/.test(h) && LESSONS.some(l => 'lesson-' + l.id === h)) return h;
  return 'play';
}
function go(route) {

}
function updateNav() {

}
function render(routeChanged) {

  App.resizers = [];
  const main = $('#main');

  else if (r === 'practice') viewPractice(main);

  if (routeChanged) { window.scrollTo(0, 0); if (main.firstElementChild) main.firstElementChild.classList.add('enter'); }
}

function viewExplore(main) {

      '<div class="ex-info">' +

        '<div class="ex-alt" id="exAlt"></div>' +

        '<div class="ex-where"><p class="mini-title">Where to play it, up to the 12th fret</p><ul id="exWhere"></ul></div>' +

    '</div></section>';
  const root = main.firstElementChild;
  function fix() {
    E.p = Math.max(-7, Math.min(14, E.p));
    const pt = pitchAt(E.p, E.a);
    if ((E.a === 1 && (pt.l === 2 || pt.l === 6)) || (E.a === -1 && (pt.l === 3 || pt.l === 0))) E.a = 0;
    const m = midiOf(pitchAt(E.p, E.a));
    if (m < 52 || m > 88) E.a = 0;

    fix();
    const p = pitchAt(E.p, E.a), midi = midiOf(p);
    const staffEl = $('#exStaff', root);
    mountStaff(staffEl, { clef: 'g8', items: [{ kind: 'note', p: E.p, acc: E.a ? E.a : undefined, dur: 'w', cls: 'sel' }], center: true, yRange: [-4.7, 8.3], aria: nm(p) + ', ' + staffPlace(E.p).toLowerCase() }, isPhone() ? 12 : 15, { stretch: true });

    staffEl.setAttribute('aria-valuetext', nm(p) + ', ' + staffPlace(E.p).toLowerCase());
    $('#exName', root).textContent = nmShort(p);
    const other = NS() === 'letters' ? noteName(p, 'solfege') : NS() === 'solfege' ? noteName(p, 'letters') : '';
    const enh = p.a ? spellings(midi).filter(x => x.a !== p.a)[0] : null;
    $('#exAlt', root).textContent = [other ? 'Also called ' + other : '', enh ? 'Same fret as ' + nmShort(enh) : ''].filter(Boolean).join(' · ');
    $('#exPlace', root).textContent = staffPlace(E.p) + (E.p === 2 ? ', where the clef curls' : '');

      const a = +b.dataset.a;
      b.setAttribute('aria-pressed', a === E.a);

    });
    const where = positionsOf(midi, 12);
    $('#exWhere', root).innerHTML = where.map(x => '<li>' + posLabel(x.s, x.f) + '</li>').join('');
    $('#exSound', root).textContent = 'Sounds one octave lower than written, at ' + soundingFreq(midi).toFixed(1) + ' hertz.';
    const dots = [];
    for (let s = 1; s <= 6; s++) for (let f = 0; f <= 12; f++) {
      const m = posMidi(s, f);
      if (m === midi) dots.push({ s, f, text: nmShort(p), cls: 'mk-accent' + (E.tap && E.tap.s === s && E.tap.f === f ? ' mk-ring' : '') });

      if (a === 'up') { E.p += 1; E.a = 0; E.tap = null; draw(); play(); }
      else if (a === 'down') { E.p -= 1; E.a = 0; E.tap = null; draw(); play(); }
