<style>
:root {
  /* Palette: engraved ink on score paper, a cobalt pencil for marking, and the guitar's own woods
     (maple neck in light, rosewood in dark) carrying the only warm color.
     Layout: one centered column, 980px at most; top tabs on wide screens, bottom tab bar on phones. */
  --bg: #eceff3;
  --paper: #fcfcfd;
  --ink: #14161b;
  --muted: #5a6172;
  --rule: #d3d8e1;
  --accent: #2443c4;
  --accent-ink: #ffffff;
  --accent-soft: #e2e8fb;
  --staff-ink: #15171c;
  --good: #137a45; --on-good: #ffffff; --good-soft: #def2e6;
  --bad: #c1352a; --on-bad: #ffffff; --bad-soft: #fae3e0;
  --warn: #a2620a; --on-warn: #ffffff; --warn-soft: #f7ead2;
  --wood-1: #efd8ab; --wood-2: #e5c48e; --wood-3: #d6ad72;
  --grain: rgba(126, 76, 22, 0.14);
  --fret-1: #9aa0a8; --fret-2: #f1f3f5;
  --nut: #f5f0e4; --nut-edge: #c5b99f;
  --inlay-1: #34302c; --inlay-2: #0e0c0b;
  --str-plain: #5f666f; --str-wound: #82592c; --str-wind: rgba(255, 244, 220, 0.42);
  --shadow: 0 1px 2px rgba(20, 22, 27, 0.06), 0 6px 18px rgba(20, 22, 27, 0.05);
  --font-display: "Bodoni Moda", "Bodoni 72", Didot, "Times New Roman", serif;
  --font-body: "Lexend", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-sym: "Lexend", "Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols 2", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f13; --paper: #161920; --ink: #e9ecf2; --muted: #9ba3b6; --rule: #2b303b;
    --accent: #93a8ff; --accent-ink: #0b1020; --accent-soft: #1c2441; --staff-ink: #e4e7ee;
    --good: #4ccb8b; --on-good: #06140c; --good-soft: #10291c;
    --bad: #ff8173; --on-bad: #1f0806; --bad-soft: #351513;
    --warn: #f2b65b; --on-warn: #1f1404; --warn-soft: #33260f;
    --wood-1: #4b2d1f; --wood-2: #3b2217; --wood-3: #2a170f;
    --grain: rgba(255, 210, 160, 0.07);
    --fret-1: #878d95; --fret-2: #e6e9ec;
    --nut: #e8e0cc; --nut-edge: #a99c80;
    --inlay-1: #fbf8f1; --inlay-2: #bcd0d8;
    --str-plain: #d0d5dc; --str-wound: #c8a16a; --str-wind: rgba(40, 24, 8, 0.45);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f13; --paper: #161920; --ink: #e9ecf2; --muted: #9ba3b6; --rule: #2b303b;
  --accent: #93a8ff; --accent-ink: #0b1020; --accent-soft: #1c2441; --staff-ink: #e4e7ee;
  --good: #4ccb8b; --on-good: #06140c; --good-soft: #10291c;
  --bad: #ff8173; --on-bad: #1f0806; --bad-soft: #351513;
  --warn: #f2b65b; --on-warn: #1f1404; --warn-soft: #33260f;
  --wood-1: #4b2d1f; --wood-2: #3b2217; --wood-3: #2a170f;
  --grain: rgba(255, 210, 160, 0.07);
  --fret-1: #878d95; --fret-2: #e6e9ec;
  --nut: #e8e0cc; --nut-edge: #a99c80;
  --inlay-1: #fbf8f1; --inlay-2: #bcd0d8;
  --str-plain: #d0d5dc; --str-wound: #c8a16a; --str-wind: rgba(40, 24, 8, 0.45);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16.5px/1.6 var(--font-body);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; }
a { color: var(--accent); }
p { margin: 0; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 16px; height: 16px; flex: none; }

/* ---------- Shell ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 14px;
  padding: 10px max(16px, calc((100% - 980px) / 2 + 20px));
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(12px); backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand-clef { height: 34px; width: 13px; fill: var(--accent); flex: none; overflow: visible; }
.brand-name { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 21px; line-height: 1; white-space: nowrap; }
.tabs { display: flex; gap: 2px; margin-left: auto; }
.tabs a { padding: 8px 14px; border-radius: 999px; text-decoration: none; color: var(--muted); font-weight: 700; font-size: 15px; }
.tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); }
.settings-btn { flex: none; }
main { display: block; max-width: 980px; margin: 0 auto; padding: 24px 20px 120px; outline: none; }
.tabbar { display: none; }

/* ---------- Type ---------- */
.title {
  font-family: var(--font-display); font-style: italic; font-weight: 600;
  font-size: clamp(34px, 6vw, 50px); line-height: 1.04; letter-spacing: -0.012em;
  margin: 0; text-wrap: balance;
}
.lede { color: var(--muted); max-width: 62ch; margin-top: 8px; }
.eyebrow { font-size: 12.5px; letter-spacing: 0.09em; text-transform: uppercase; font-weight: 700; color: var(--muted); margin: 0 0 6px; }
.sec-title { font-family: var(--font-display); font-weight: 600; font-size: 23px; line-height: 1.2; margin: 0; text-wrap: balance; }
.view-head { margin-bottom: 20px; }
.mini-title { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.hint { color: var(--muted); font-size: 14px; }

/* ---------- Controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 16px; border-radius: 10px;
  border: 1.5px solid var(--rule); background: var(--paper); color: var(--ink);
  font-weight: 700; font-size: 15.5px; line-height: 1.15; text-decoration: none; cursor: pointer;
  transition: border-color .15s, background-color .15s, transform .08s;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 9px; }
.btn.icon { width: 44px; padding: 0; }
.btn.danger { color: var(--bad); }
.btn.is-done { color: var(--good); border-color: var(--good); }
.seg { display: inline-flex; flex-wrap: nowrap; background: var(--bg); border: 1px solid var(--rule); border-radius: 11px; padding: 3px; gap: 2px; max-width: 100%; }
.seg.wrap { flex-wrap: wrap; }
.seg button {
  border: 0; background: transparent; padding: 7px 12px; min-height: 38px; min-width: 42px;
  border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; color: var(--muted);
  font-family: var(--font-sym);
}
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 0 0 1px var(--rule), 0 1px 2px rgba(0,0,0,.1); }
.seg button:disabled { opacity: .3; cursor: not-allowed; }
.seg.small button { padding: 5px 10px; min-height: 34px; font-size: 14px; }
.seg.multi button { line-height: 1.05; padding: 5px 10px; }
.seg.multi small { display: block; font-size: 11px; font-weight: 400; }
.check { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
.check.small { font-size: 14px; gap: 7px; }
.check.small input { width: 18px; height: 18px; }

/* ---------- Surfaces ---------- */
.paper { background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; }
.board-card { background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; padding: 10px 6px 6px; }
.board-card .check { margin: 8px 10px 4px; }

/* ---------- Staff ---------- */
.staff { display: block; color: var(--staff-ink); overflow: visible; }
.staff .sl { fill: currentColor; opacity: .8; }
.staff use, .staff .stem, .staff .bar, .staff .beam, .staff .tie { fill: currentColor; }
.staff .ledger { fill: var(--staff-ink); }
.staff .nt { transition: color .18s; }
.staff .nt.on, .staff .nt.sel { color: var(--accent); }
.staff .nt.good { color: var(--good); }
.staff .nt.shown { color: var(--bad); }
.staff .nt[data-i] { cursor: pointer; }
.staff .nt-hit { fill: transparent; }
.staff .nt.m-new { color: var(--muted); opacity: .38; }
.staff .nt.m-weak { color: var(--bad); }
.staff .nt.m-ok { color: var(--warn); }
.staff .nt.m-strong { color: var(--good); }
.staff .lbl { font-family: var(--font-sym); font-size: 1.32px; fill: var(--muted); }
.staff .lbl tspan.lbl2 { font-size: 1.08px; }
.staff .lbl.hl { fill: var(--accent); font-weight: 700; }
.staff .lbl.rh { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 1.6px; fill: var(--staff-ink); }
.staff .fing { font-family: var(--font-body); font-weight: 700; font-size: 1.3px; fill: currentColor; }
.staff .posmark { font-family: var(--font-display); font-weight: 700; font-size: 1.8px; fill: currentColor; }
.staff .strnum circle { fill: none; stroke: currentColor; stroke-width: .12; }
.staff .strnum text { font-family: var(--font-body); font-size: 1.12px; font-weight: 700; fill: currentColor; }
.tabst .tab-lbl { font-family: var(--font-display); font-weight: 800; font-size: 1.95px; fill: currentColor; }
.tabst .tab-bg { fill: var(--paper); }
.tabst text { font-family: var(--font-body); font-weight: 700; font-size: 1.5px; fill: currentColor; }
.tabst .tab-n.on text { fill: var(--accent); }

/* ---------- Fretboard ---------- */
.fb-wrap { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
.fb-wrap svg { display: block; margin: 0 auto; }
.fb-wrap.scrolls svg { margin: 0; }
.fb-wrap.scrolls { mask-image: linear-gradient(90deg, #000 88%, transparent); -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); }
.fb .fb-grain { fill: none; stroke: var(--grain); stroke-width: 1.3; }
.fb .fb-nut { fill: var(--nut); stroke: var(--nut-edge); stroke-width: .8; }
.fb .fb-str { stroke-linecap: round; }
.fb .fb-str.plain { stroke: var(--str-plain); }
.fb .fb-str.wound { stroke: var(--str-wound); }
.fb .fb-wind { stroke: var(--str-wind); stroke-dasharray: 0.9 1.1; }
.fb .dim { opacity: .3; }
.fb .fb-slbl { font: 700 12.5px var(--font-sym); fill: var(--muted); }
.fb .fb-fnum { font: 400 11.5px var(--font-body); fill: var(--muted); }
.fb .fb-fnum.strong { font-weight: 700; fill: var(--ink); }
.fb .hit { fill: transparent; cursor: pointer; outline: none; }
.fb .hit:focus-visible { fill: rgba(36, 67, 196, 0.22); stroke: var(--accent); stroke-width: 2; }
.mk { pointer-events: none; }
.mk circle { fill: var(--accent); stroke: var(--paper); stroke-width: 2; }
.mk text { fill: var(--accent-ink); font-family: var(--font-sym); font-weight: 700; }
.mk-good circle { fill: var(--good); }
.mk-good text { fill: var(--on-good); }
.mk-bad circle { fill: var(--bad); }
.mk-bad text { fill: var(--on-bad); }
.mk-soft circle { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
.mk-soft text { fill: var(--accent); }
.mk-nat circle { fill: var(--paper); stroke: var(--rule); stroke-width: 1; opacity: .92; }
.mk-nat text { fill: var(--ink); font-weight: 400; }
.mk-dot circle { fill: var(--paper); stroke: var(--accent); stroke-width: 1.5; }
.mk-dot.on circle { fill: var(--good); stroke: var(--good); }
.mk-ring circle { stroke: var(--ink); stroke-width: 3; }
.mk-ask circle { fill: var(--accent); }
.mk-ask .ring { fill: none; stroke: var(--accent); stroke-width: 3; transform-box: fill-box; transform-origin: center; }
.mk-m-weak circle { fill: var(--bad); } .mk-m-weak text { fill: var(--on-bad); }
.mk-m-ok circle { fill: var(--warn); } .mk-m-ok text { fill: var(--on-warn); }
.mk-m-strong circle { fill: var(--good); } .mk-m-strong text { fill: var(--on-good); }

/* ---------- Explore ---------- */
.ex-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); grid-template-areas: "staff info" "board board"; gap: 16px; }
.ex-staff-card { grid-area: staff; position: relative; padding: 8px 60px 8px 6px; display: flex; align-items: center; min-height: 200px; }
.ex-staff { flex: 1; min-width: 0; cursor: pointer; border-radius: 10px; }
.ex-staff svg { display: block; margin: 0 auto; }
.ex-steps { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; }
.ex-info { grid-area: info; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 4px 2px; }
.ex-name-row { display: flex; align-items: center; gap: 16px; }
.ex-name { font-family: var(--font-display); font-weight: 700; font-size: 72px; line-height: .9; font-variant-numeric: lining-nums; min-width: 1.2em; }
.ex-alt { color: var(--muted); font-size: 15px; min-height: 1.2em; }
.ex-place { font-weight: 700; font-size: 17px; }
.ex-where ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.ex-where li { font-size: 14px; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.ex-sound { font-size: 13.5px; color: var(--muted); }
.ex-board { grid-area: board; }

/* ---------- Learn ---------- */
.learn-meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 16px; font-size: 15px; color: var(--muted); }
.meter-bar { width: 140px; height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.meter-bar span { display: block; height: 100%; background: var(--good); }
.toc-part { margin-top: 28px; }
.part-title { font-size: 12.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.toc { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.toc-row { display: grid; grid-template-columns: 46px minmax(0, 1fr) 28px; gap: 12px; align-items: center; padding: 14px 4px; border-bottom: 1px solid var(--rule); text-decoration: none; color: var(--ink); }
.toc-num { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 30px; line-height: 1; color: var(--muted); text-align: center; font-variant-numeric: lining-nums; }
.toc-row.done .toc-num { color: var(--good); }
.toc-title { display: block; font-weight: 700; font-size: 17.5px; line-height: 1.3; }
.toc-sum { display: block; color: var(--muted); font-size: 14.5px; line-height: 1.4; margin-top: 2px; }
.toc-state { color: var(--good); display: grid; place-items: center; }
.toc-state .ic { width: 20px; height: 20px; }

/* ---------- Lesson ---------- */
.lesson { max-width: 780px; margin: 0 auto; }
.back { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; text-decoration: none; margin-bottom: 18px; }
.lesson-head { margin-bottom: 22px; }
.lesson-body > p, .lesson-body > ul { max-width: 64ch; }
.lesson-body > p { margin: 0 0 14px; }
.lesson-body b { font-weight: 700; }
.facts { padding-left: 20px; margin: 0 0 14px; }
.facts li { margin: 6px 0; }
.fig { margin: 20px 0 24px; padding: 14px 14px 12px; background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow); }
.fig .seg { margin-bottom: 8px; }
.fig .fb-wrap { margin-top: 8px; }
.fig-staff svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
.fig-staff.tab { margin-top: 2px; }
.fig-cap { font-size: 14px; color: var(--muted); margin: 10px 2px 0; }
.fig-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.steps { display: flex; align-items: center; justify-content: center; padding: 6px 2px 10px; }
.step-note { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--accent); background: var(--paper); color: var(--accent); font-family: var(--font-display); font-weight: 700; font-size: 17px; cursor: pointer; padding: 0; }
.step-note.on { background: var(--good); border-color: var(--good); color: var(--on-good); }
.step-gap { flex: 1 1 20px; min-width: 14px; max-width: 70px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.step-gap i { display: block; height: 2px; width: 100%; background: var(--rule); }
.step-gap em { font-style: normal; font-size: 11px; color: var(--muted); white-space: nowrap; }
.step-gap.half i { background: var(--bad); }
.step-gap.half em { color: var(--bad); font-weight: 700; }
.len-row + .len-row { border-top: 1px dashed var(--rule); margin-top: 8px; padding-top: 8px; }
.len-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.len-head span { color: var(--muted); font-size: 14px; }
.len-head .btn { margin-left: auto; }
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 18px; }
.neck-top { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 14px; align-items: center; }
.neck-top .fig-cap { margin: 0; }
.keypoints { margin: 28px 0 20px; padding: 16px 18px 14px; border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 12px 12px 0; }
.keypoints h2 { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 21px; margin: 0 0 6px; }
.keypoints ul { margin: 0; padding-left: 20px; }
.keypoints li { margin: 5px 0; }
.lesson-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.lesson-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 30px; border-top: 1px solid var(--rule); padding-top: 16px; }
.ln { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--ink); padding: 6px 2px; }
.ln span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 700; }
.ln b { font-size: 16px; }
.ln.next { text-align: right; align-items: flex-end; }

/* ---------- Practice ---------- */
.pr-block + .pr-block { margin-top: 30px; }
.pr-config { display: grid; gap: 12px; padding: 14px 16px; background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; margin: 12px 0 4px; }
.field { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.field-label { width: 60px; font-weight: 700; font-size: 14px; color: var(--muted); }
.pr-summary { font-size: 14.5px; color: var(--muted); }
.pr-summary b { color: var(--ink); }
.mode-list { border-top: 2px solid var(--ink); margin-top: 12px; }
.mode { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 16px 2px; border-bottom: 1px solid var(--rule); }
.mode-btns { display: flex; flex-direction: column; gap: 8px; }
.mode-art { width: 52px; height: 52px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.mode-art svg { width: 34px; height: 26px; overflow: visible; }
.mode h3 { font-size: 17.5px; margin: 0; line-height: 1.25; }
.mode-txt p { color: var(--muted); font-size: 14.5px; line-height: 1.4; margin-top: 2px; }
.mode-txt .mode-last { font-size: 13px; margin-top: 4px; }
.mode-opts { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; margin-top: 8px; font-size: 14px; }
.opt-label { color: var(--muted); }

/* ---------- Play: the level path ---------- */
.play-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px 28px; flex-wrap: wrap; margin-bottom: 18px; }
.play-intro { flex: 1 1 340px; }
.hud { display: flex; gap: 10px; flex-wrap: wrap; }
.hud-goal, .hud-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; }
.hud-item { flex-direction: column; align-items: flex-start; justify-content: center; gap: 0; }
.hud b { display: block; font-family: var(--font-display); font-weight: 700; font-size: 27px; line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
.hud span { display: block; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.ring { width: 44px; height: 44px; flex: none; }
.ring-bg { fill: none; stroke: var(--rule); stroke-width: 5; }
.ring-fg { fill: none; stroke: var(--warn); stroke-width: 5; stroke-linecap: round; }
.continue-btn { width: 100%; min-height: 56px; font-size: 16.5px; margin: 2px 0 20px; justify-content: space-between; padding: 0 18px; border-bottom-width: 4px; border-bottom-color: rgba(0, 0, 0, .28); border-radius: 14px; text-align: left; }
.path { position: relative; padding-top: 12px; }
.path::before { content: ""; position: absolute; left: 24px; top: 0; width: 96px; height: 12px; background: var(--nut); border-radius: 4px 4px 0 0; box-shadow: inset 0 -2px 0 var(--nut-edge); }
.lvl-row { position: relative; display: grid; grid-template-columns: 120px minmax(0, 1fr); column-gap: 24px; min-height: 144px; }
.neck-seg { position: absolute; left: 24px; top: 0; bottom: 0; width: 96px; background: linear-gradient(90deg, var(--wood-3), var(--wood-1) 22%, var(--wood-2) 78%, var(--wood-3)); }
.neck-seg::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 4px; background: linear-gradient(var(--fret-2), var(--fret-1)); z-index: 1; }
.neck-str { position: absolute; inset: 0; width: 100%; height: 100%; }
.neck-str .w { stroke: var(--str-wound); }
.neck-str .p { stroke: var(--str-plain); }
.inlay { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, var(--inlay-1), var(--inlay-2)); }
.inlay.a { top: 22%; }
.inlay.b { top: 78%; }
.fret-no { position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 20px; text-align: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.node {
  position: absolute; left: 42px; top: 50%; width: 60px; height: 60px; margin-top: -30px; transform: translateX(var(--dx, -14px));
  border-radius: 50%; border: 3px solid var(--paper); background: var(--paper); color: var(--ink);
  font: 700 23px/1 var(--font-display); font-variant-numeric: lining-nums; display: grid; place-items: center; cursor: pointer; z-index: 2; padding: 0;
  box-shadow: 0 4px 0 rgba(0, 0, 0, .22), 0 8px 18px rgba(0, 0, 0, .16);
}
.lvl-row.alt .node { --dx: 14px; }
.node:active { transform: translateX(var(--dx, -14px)) translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, .22); }
.lvl-row.done .node { background: var(--good); color: var(--on-good); }
.lvl-row.done .node .ic { width: 26px; height: 26px; }
.lvl-row.next .node { background: var(--accent); color: var(--accent-ink); }
.lvl-row.next .node::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 3px solid var(--accent); opacity: 0; }
.lvl-card { grid-column: 2; align-self: center; padding: 16px 0; }
.part-label { font-size: 12.5px; letter-spacing: .09em; text-transform: uppercase; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
.lvl-num { font-size: 13px; color: var(--muted); font-weight: 700; }
.lvl-title { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.2; margin: 2px 0; text-wrap: balance; }
.lvl-sum { font-size: 14.5px; color: var(--muted); }
.lvl-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
.read-link { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; text-decoration: none; }
.stars { display: flex; gap: 3px; margin-top: 6px; }
.stars svg { width: 20px; height: 20px; fill: var(--rule); }
.stars svg.on { fill: var(--warn); }
.stars.big { justify-content: center; gap: 14px; margin: 16px 0 6px; }
.stars.big svg { width: 66px; height: 66px; }
.lesson-actions .stars { margin: 0 0 0 6px; align-self: center; }

/* ---------- Quiz run ---------- */
.run { max-width: 720px; margin: 0 auto; }
.run-top { display: flex; align-items: center; gap: 12px; }
.run-track { flex: 1; height: 14px; border-radius: 7px; background: var(--rule); overflow: hidden; }
.run-fill { height: 100%; width: 0; border-radius: 7px; background: var(--good); transition: width .45s cubic-bezier(.2, .8, .2, 1); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .1), inset 0 3px 0 rgba(255, 255, 255, .28); }
.run-challenge .run-fill { background: var(--accent); transition: width .1s linear; }
.run-time { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
.run-time.low { color: var(--bad); }
.run-combo { display: inline-flex; align-items: center; gap: 2px; color: var(--warn); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 36px; }
.run-combo .ic { width: 20px; height: 20px; }
.run-xp { font-size: 14px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.run-xp b { color: var(--ink); font-size: 16px; }
.run-card { padding: 22px 0 200px; }
.card-kicker { display: flex; align-items: center; gap: 8px; font-size: 12.5px; letter-spacing: .09em; text-transform: uppercase; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
.retry-tag { letter-spacing: 0; text-transform: none; font-size: 12.5px; color: var(--warn); background: var(--warn-soft); border-radius: 999px; padding: 2px 9px; }
.card-prompt, .card-title { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: clamp(26px, 5.2vw, 38px); line-height: 1.12; margin: 0 0 16px; text-wrap: balance; }
.card-text { max-width: 60ch; font-size: 17px; }
.card-text p + p { margin-top: 10px; }
.teach .fig, .teach .card-vis, .teach .board-card { margin-top: 18px; }
.card-vis { padding: 6px 0; margin-bottom: 16px; overflow: hidden; }
.card-vis svg { display: block; margin: 0 auto; }
.q .board-card { margin-bottom: 16px; }
.tapstaff { cursor: crosshair; }
.tap-adj { display: flex; justify-content: center; gap: 8px; margin: -6px 0 14px; }
.listen { display: flex; justify-content: center; margin: 4px 0 20px; }
.btn.big { min-height: 64px; padding: 0 28px; font-size: 18px; border-radius: 16px; border-bottom-width: 4px; }
.answers { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 8px; }
.ans {
  min-height: 60px; border: 2px solid var(--rule); border-bottom-width: 4px; background: var(--paper); border-radius: 13px; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; padding: 6px 2px; transition: transform .08s, border-color .15s, background-color .15s, opacity .15s;
}
.ans:active:not(:disabled) { transform: translateY(2px); }
.ans-main { font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1; font-variant-numeric: lining-nums; }
.ans-main.two { font-size: 16px; line-height: 1.15; font-family: var(--font-sym); }
.ans-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
.ans-sym { display: block; color: var(--staff-ink); }
.ans-sym svg { display: block; margin: 0 auto 2px; }
.ans:disabled { cursor: default; }
.ans.is-right { background: var(--good); border-color: var(--good); color: var(--on-good); }
.ans.is-wrong { background: var(--bad); border-color: var(--bad); color: var(--on-bad); }
.ans.is-right .ans-sub, .ans.is-wrong .ans-sub, .ans.is-right .ans-sym, .ans.is-wrong .ans-sym { color: inherit; opacity: .9; }
.ans.dim { opacity: .4; }
.lay-symbols .ans { min-height: 96px; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opts.lay-list { grid-template-columns: minmax(0, 1fr); }
.opt {
  display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 12px 14px;
  border: 2px solid var(--rule); border-bottom-width: 4px; border-radius: 14px; background: var(--paper); color: var(--ink);
  text-align: left; cursor: pointer; font-size: 16.5px; line-height: 1.3; transition: transform .08s, border-color .15s, background-color .15s, opacity .15s;
}
.opt:active:not(:disabled) { transform: translateY(2px); }
.opt-key { flex: none; width: 28px; height: 28px; border-radius: 8px; border: 1.5px solid var(--rule); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--muted); }
.opt-key .ic { width: 14px; height: 14px; }
.opt-txt { min-width: 0; }
.opt.is-right { border-color: var(--good); background: var(--good-soft); }
.opt.is-right .opt-key { background: var(--good); border-color: var(--good); color: var(--on-good); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.is-wrong .opt-key { background: var(--bad); border-color: var(--bad); color: var(--on-bad); }
.opt.dim { opacity: .45; }
.opt:disabled { cursor: default; }
.opts.lay-tf .opt { justify-content: center; min-height: 76px; font-size: 19px; font-weight: 700; }
.order-slots { display: flex; flex-wrap: wrap; gap: 8px; min-height: 68px; padding: 9px; border: 2px dashed var(--rule); border-radius: 14px; }
.slot { min-width: 50px; height: 46px; padding: 0 12px; border-radius: 10px; border: 2px solid transparent; background: var(--bg); color: var(--muted); font: 700 19px var(--font-display); }
.slot-n { font: 400 13px var(--font-body); opacity: .7; }
.slot.filled { background: var(--paper); color: var(--ink); border-color: var(--rule); border-bottom-width: 4px; cursor: pointer; }
.slot.right { border-color: var(--good); background: var(--good-soft); }
.slot.wrong { border-color: var(--bad); background: var(--bad-soft); }
.slot:disabled { cursor: default; }
.order-hint { font-size: 13.5px; color: var(--muted); margin: 8px 2px 0; }
.order-pool { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip-btn { min-width: 52px; height: 50px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--rule); border-bottom-width: 4px; background: var(--paper); color: var(--ink); font: 700 19px var(--font-display); cursor: pointer; }
.chip-btn.long, .order.long .slot { font: 700 15px var(--font-body); }
.chip-btn:disabled { opacity: .22; cursor: default; }
.run-foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--paper); border-top: 2px solid var(--rule); padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }
.run-foot.slim { display: none; }
.run-foot.ok { background: var(--good-soft); border-top-color: var(--good); }
.run-foot.no { background: var(--bad-soft); border-top-color: var(--bad); }
.foot-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; }
.foot-msg { flex: 1 1 340px; min-width: 0; }
.foot-title { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; flex-wrap: wrap; }
.run-foot.ok .foot-title { color: var(--good); }
.run-foot.no .foot-title { color: var(--bad); }
.foot-icon { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: currentColor; flex: none; }
.foot-icon .ic { color: var(--paper); width: 16px; height: 16px; }
.foot-text { margin-top: 4px; font-size: 15.5px; color: var(--ink); }
.foot-note { margin-top: 4px; font-size: 13.5px; color: var(--muted); }
.foot-btns { display: flex; gap: 8px; margin-left: auto; }
.foot-main { min-width: 160px; min-height: 52px; font-size: 17px; border-bottom-width: 4px; border-bottom-color: rgba(0, 0, 0, .28); }
.run-foot.ok .foot-main { background: var(--good); border-color: var(--good); border-bottom-color: rgba(0, 0, 0, .28); color: var(--on-good); }
.run-foot.no .foot-main { background: var(--bad); border-color: var(--bad); border-bottom-color: rgba(0, 0, 0, .28); color: var(--on-bad); }
.foot-hint { color: var(--muted); font-size: 14.5px; }
.foot-skip { color: var(--muted); }
.xp-pop { font-size: 13px; color: var(--warn); background: var(--warn-soft); border-radius: 999px; padding: 2px 10px; font-weight: 700; }
body.in-run .tabbar { display: none; }

/* ---------- Results ---------- */
.results { max-width: 720px; margin: 0 auto; text-align: center; }
.results .score-big { justify-content: center; }
.res-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 22px 0 12px; text-align: left; }
.res-note { color: var(--muted); font-size: 14.5px; }
.results .sec-title { text-align: left; margin-top: 26px; }
.results .review { text-align: left; }
.results .actions { justify-content: center; }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

/* ---------- Summary ---------- */
.score-big { display: flex; align-items: baseline; gap: 12px; margin: 16px 0 4px; }
.score-big .num { font-family: var(--font-display); font-weight: 700; font-size: 104px; line-height: .86; font-variant-numeric: lining-nums tabular-nums; }
.score-big .of { font-size: 20px; color: var(--muted); }
.summary .sec-title { margin-top: 26px; }
.review { list-style: none; padding: 0; margin: 10px 0 0; border-top: 2px solid var(--ink); }
.review li { display: flex; gap: 14px; align-items: baseline; padding: 11px 2px; border-bottom: 1px solid var(--rule); }
.rv-name { font-family: var(--font-display); font-weight: 700; font-size: 21px; min-width: 70px; font-variant-numeric: lining-nums; }
.rv-detail { color: var(--muted); font-size: 15px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; }

/* ---------- Progress ---------- */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stat { padding: 14px 16px; background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; }
.stat b { display: block; font-family: var(--font-display); font-size: 38px; font-weight: 700; line-height: 1.05; font-variant-numeric: lining-nums tabular-nums; }
.stat span { color: var(--muted); font-size: 14px; }
.legend { display: flex; gap: 8px 16px; flex-wrap: wrap; margin-top: 16px; font-size: 14px; color: var(--muted); }
.lg { display: inline-flex; align-items: center; gap: 7px; }
.lg i, .chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--rule); flex: none; }
.m-weak i { background: var(--bad); }
.m-ok i { background: var(--warn); }
.m-strong i { background: var(--good); }
.m-new i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
.pg-sec { margin-top: 28px; }
.pg-head { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; margin-bottom: 10px; }
.pg-staff { padding: 6px 4px; }
.pg-row svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; background: var(--paper); border: 1px solid var(--rule); font-size: 14px; }
.pg-foot { margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--rule); }

/* ---------- Sheets ---------- */
.sheet { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(8, 10, 16, .5); padding: 16px; }
.sheet[hidden] { display: none; }
.sheet-card { width: min(500px, 100%); max-height: calc(100% - 24px); overflow: auto; background: var(--paper); border-radius: 18px; padding: 22px 22px 18px; box-shadow: 0 24px 70px rgba(0, 0, 0, .35); border: 1px solid var(--rule); }
.sheet-card h2 { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 28px; margin: 0 0 12px; }
.sheet-card fieldset { border: 0; padding: 0; margin: 0 0 16px; }
.sheet-card legend { font-weight: 700; font-size: 14px; color: var(--muted); margin-bottom: 8px; padding: 0; }
.radio-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.radio-row label { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px; border: 1.5px solid var(--rule); border-radius: 12px; cursor: pointer; text-align: center; }
.radio-row label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.radio-row input { position: absolute; opacity: 0; pointer-events: none; }
.radio-row b { font-family: var(--font-display); font-size: 19px; }
.radio-row small { font-size: 12.5px; color: var(--muted); }
.radio-row label:focus-within { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-top: 1px solid var(--rule); font-size: 15.5px; }
.switch-row input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.sheet-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
.sheet-note { font-size: 13.5px; color: var(--muted); margin-top: 4px; }

/* ---------- Phone ---------- */
@media (max-width: 720px) {
  body.in-run main { padding-top: 12px; }
  .run-card { padding: 16px 0 230px; }
  .opts { grid-template-columns: minmax(0, 1fr); }
  .opts.lay-tf { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .opt { min-height: 54px; }
  .answers { gap: 6px; }
  .ans { min-height: 56px; border-radius: 11px; }
  .ans-main { font-size: 22px; }
  .ans-main.two { font-size: 14px; }
  .answers.lay-strings { --cols: 3 !important; }
  .lay-symbols .ans { min-height: 86px; }
  .foot-btns { width: 100%; margin-left: 0; }
  .foot-main { flex: 1; }
  .foot-title { font-size: 18px; }
  .foot-hint { flex: 1; text-align: right; }
  .hud { width: 100%; }
  .hud-goal, .hud-item { flex: 1 1 0; padding: 9px 10px; }
  .hud b { font-size: 23px; }
  .ring { width: 38px; height: 38px; }
  .lvl-row { grid-template-columns: 96px minmax(0, 1fr); column-gap: 14px; min-height: 152px; }
  .path::before { left: 12px; width: 80px; }
  .neck-seg { left: 12px; width: 80px; }
  .node { left: 24px; width: 56px; height: 56px; margin-top: -28px; font-size: 21px; --dx: -10px; }
  .lvl-row.alt .node { --dx: 10px; }
  .fret-no { display: none; }
  .lvl-title { font-size: 19.5px; }
  .lvl-sum { display: none; }
  .res-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stars.big svg { width: 56px; height: 56px; }
  body { font-size: 16px; }
  .tabs { display: none; }
  .settings-btn { margin-left: auto; }
  .top { padding: 8px 12px; }
  .brand-name { font-size: 19px; }
  main { padding: 16px 16px 100px; }
  .tabbar {
    display: grid; grid-template-columns: repeat(4, 1fr);
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--paper); border-top: 1px solid var(--rule);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; font-weight: 700; color: var(--muted); text-decoration: none; padding: 3px 0; }
  .tabbar a[aria-current="page"] { color: var(--accent); }
  .tabbar svg { width: 25px; height: 25px; }
  .ex-grid { grid-template-columns: minmax(0, 1fr); grid-template-areas: "staff" "board" "info"; gap: 12px; }
  .ex-staff-card { min-height: 0; padding-right: 58px; }
  .ex-name { font-size: 56px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat b { font-size: 32px; }
  .score-big .num { font-size: 84px; }
  .mode { grid-template-columns: 44px minmax(0, 1fr); gap: 4px 12px; }
  .mode-art { width: 44px; height: 44px; }
  .mode-btns { grid-column: 2; flex-direction: row; flex-wrap: wrap; margin-top: 8px; }
  .neck-top { grid-template-columns: 120px minmax(0, 1fr); }
  .step-note { width: 32px; height: 32px; font-size: 15px; }
  .step-gap { min-width: 8px; }
  .field-label { width: 100%; }
  .lesson-nav { grid-template-columns: 1fr; }
  .ln.next { text-align: left; align-items: flex-start; }
  .sheet { place-items: end center; padding: 10px; }
}

@media (prefers-reduced-motion: no-preference) {
  .card-vis .nt { animation: noteIn .3s ease-out; }
  .lvl-row.next .node::after { animation: ring 1.8s ease-out infinite; }
  .stars.big svg.on { animation: starIn .6s cubic-bezier(.2, 1.6, .4, 1) backwards; animation-delay: var(--d); }
  .card.shake { animation: shake .4s; }
  .card.glow .is-right { animation: pop .35s; }
  .run-combo.pop { animation: pop .4s cubic-bezier(.2, 1.6, .4, 1); }
  .xp-pop { animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); }
  .run-foot.ok, .run-foot.no { animation: footIn .22s ease-out; }
  .mk-ask .ring { animation: pulse 1.5s ease-out infinite; }
  .view.enter { animation: viewIn .22s ease-out; }
}
@keyframes noteIn { from { opacity: 0; transform: translateY(-0.7px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0% { transform: scale(.8); opacity: 1; } 100% { transform: scale(1.45); opacity: 0; } }
@keyframes viewIn { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }

@media (hover: hover) {
  .tabs a:hover { color: var(--ink); }
  .tabs a[aria-current="page"]:hover { color: var(--bg); }
  .btn:hover { border-color: var(--ink); }
  .btn.primary:hover { filter: brightness(1.08); border-color: var(--accent); }
  .btn.ghost:hover { border-color: var(--rule); }
  .seg button:hover { color: var(--ink); }
  .fb .hit:hover { fill: rgba(36, 67, 196, 0.12); }
  .toc-row:hover .toc-title { color: var(--accent); }
  .ln:hover b { color: var(--accent); }
  .ans:hover:not(:disabled) { border-color: var(--accent); }
  .step-note:hover { background: var(--accent-soft); }
}
.fb-wrap.scrolls.at-end { mask-image: none; -webkit-mask-image: none; }

@keyframes ring { 0% { transform: scale(.85); opacity: .9; } 100% { transform: scale(1.25); opacity: 0; } }
@keyframes starIn { from { transform: scale(0) rotate(-40deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes footIn { from { transform: translateY(14px); opacity: .5; } to { transform: none; opacity: 1; } }
@media (hover: hover) {
  .opt:hover:not(:disabled), .chip-btn:hover:not(:disabled), .node:hover { border-color: var(--accent); }
}
.pg-line { color: var(--muted); font-size: 14.5px; margin-top: 12px; }
.staff .mslot { fill: var(--accent-soft); stroke: var(--accent); stroke-width: .12; stroke-dasharray: .45 .3; }
.sym .sl { opacity: .3; }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.22); } 100% { transform: scale(1); } }
.hud b small { font-family: var(--font-body); font-size: 13px; font-weight: 700; color: var(--muted); margin-left: 2px; }
.slot:not(.filled) { border: 2px dashed var(--rule); background: transparent; }
.run-foot.ok .foot-main:hover { background: var(--good); border-color: var(--good); border-bottom-color: rgba(0, 0, 0, .28); filter: brightness(1.06); }
.run-foot.no .foot-main:hover { background: var(--bad); border-color: var(--bad); border-bottom-color: rgba(0, 0, 0, .28); filter: brightness(1.06); }
.hud-goal span { white-space: nowrap; }
@media (max-width: 720px) { .hud-goal { gap: 7px; } .hud-goal .ring { width: 30px; height: 30px; } }

/* Notation everywhere */
.staff .gl { fill: currentColor; }
.staff .tag { font-family: var(--font-display); font-weight: 700; font-size: 1.85px; fill: currentColor; }
.staff .nt.ghost { color: var(--accent); opacity: .45; }
.staff .nt.faint { opacity: .28; }
.staff .nt.ping { color: var(--accent); }
.card-vis + .board-card, .board-card + .card-vis { margin-top: -4px; }
.chip-btn.pic, .slot.pic { height: auto; min-height: 50px; padding: 6px 10px 5px; display: inline-flex; flex-direction: column; align-items: center; gap: 1px; }
.chip-pic { display: block; color: var(--staff-ink); line-height: 0; }
.chip-pic svg { display: block; }
.chip-btn.pic .chip-txt, .slot.pic .chip-txt { font: 700 13px var(--font-body); }
.order.long .slot.filled .chip-txt { font: 700 14px var(--font-body); }
.lvl-thumb { margin: 2px 0 6px; color: var(--staff-ink); line-height: 0; }
.lvl-thumb svg { display: block; max-width: 100%; height: auto; }
.lvl-row.done .lvl-thumb { color: var(--good); }

/* Karplus-Strong plucked string, with an all-pass filter for exact tuning. */
function pluckSamples(freq, sr, rand) {
  rand = rand || Math.random;
  const dur = freq < 150 ? 3.4 : freq < 300 ? 2.8 : 2.2;
  const len = Math.floor(sr * dur);
  const out = new Float32Array(len);
  const D = sr / freq;
  let L = Math.floor(D - 0.5);
  let frac = D - 0.5 - L;
  if (frac < 0.15) { L -= 1; frac += 1; }
  const C = (1 - frac) / (1 + frac);
  const line = new Float32Array(L);
  let lp = 0;
  for (let i = 0; i < L; i++) { lp += 0.5 * ((rand() * 2 - 1) - lp); line[i] = lp; }
  const pp = Math.max(1, Math.round(L * 0.17));
  const ex = Float32Array.from(line);
  for (let i = 0; i < L; i++) line[i] = ex[i] - 0.85 * ex[(i - pp + L) % L];
  let mean = 0;
  for (let i = 0; i < L; i++) mean += line[i];
  mean /= L;
  for (let i = 0; i < L; i++) line[i] -= mean;
  const T60 = freq < 150 ? 3.2 : freq < 300 ? 2.4 : 1.7;
  const g = Math.pow(0.001, 1 / (T60 * freq));
  let idx = 0, prev = 0, apX = 0, apY = 0;
  for (let n = 0; n < len; n++) {
    const y = line[idx];
    out[n] = y;
    const avg = 0.5 * (y + prev);
    prev = y;
    const ap = C * avg + apX - C * apY;
    apX = avg; apY = ap;
    line[idx] = ap * g;
    if (++idx >= L) idx = 0;
  }
  let peak = 0;
  for (let n = 0; n < len; n++) { const v = Math.abs(out[n]); if (v > peak) peak = v; }
  const norm = peak > 0 ? 0.7 / peak : 1;
  const fade = Math.floor(sr * 0.12);
  for (let n = 0; n < len; n++) {
    let v = out[n] * norm;
    if (n < 24) v *= n / 24;
    if (n > len - fade) v *= (len - n) / fade;
    out[n] = v;
  }
  return out;
}

/* ============================================================
   Notation and fretboard drawing (SVG strings).
   Staff units are staff spaces: y = 0 is the top line, y = 4 the bottom line.
   ============================================================ */
const ENG = { line: 0.13, stem: 0.12, ledger: 0.16, ledgerExt: 0.4, thin: 0.16, thick: 0.5, beam: 0.5, beamStep: 0.75 };
const HEAD = { w: 'noteheadWhole', h: 'noteheadHalf', q: 'noteheadBlack', e: 'noteheadBlack', s: 'noteheadBlack' };
const REST = { w: 'restWhole', h: 'restHalf', q: 'restQuarter', e: 'rest8th', s: 'rest16th' };
const ACC_GLYPH = { '-1': 'accidentalFlat', '0': 'accidentalNatural', '1': 'accidentalSharp' };

function n3(v) { return Math.round(v * 1000) / 1000; }
function yOf(p) { return (8 - p) / 2; }
function gw(name) { return GLYPHS[name].b[2]; }
/* Glyphs are written as plain paths in every drawing, so no viewer has to resolve references. */
function use(name, x, y, extra) {
  let cls = 'gl', rest = extra || '';
  const m = /^\s*class="([^"]*)"(.*)$/.exec(rest);
  if (m) { cls += ' ' + m[1]; rest = m[2]; }
  return '<path class="' + cls + '" d="' + GLYPHS[name].d + '" transform="translate(' + n3(x) + ' ' + n3(y) + ')"' + rest + '/>';

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* Hidden sprite with every glyph, referenced by <use>. */
