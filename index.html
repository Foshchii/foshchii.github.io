<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    const run = (m) => { this._alive = m.init(); };
    if (window.__aliveMod) { run(window.__aliveMod); return; }
    let tries = 0;
    const poll = () => {
      if (window.__aliveMod) return run(window.__aliveMod);
      if (tries++ > 150) { import('./alive.js').then(run).catch((e) => console.warn('alive init failed', e)); return; }
      this._pollId = setTimeout(poll, 20);
    };
    poll();
  }
  componentWillUnmount() {
    if (this._pollId) clearTimeout(this._pollId);
    if (this._alive) this._alive();
  }
  renderVals() {
    return { copyrightYear: new Date().getFullYear() };
  }
}
</script>
